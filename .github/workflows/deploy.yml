name: Deploy

# 触发条件：
# 1. push 到 main / master 分支 → 完整流水线（测试 + 迁移 + 部署）
# 2. push 到非主分支 → 仅测试（不部署）
# 3. 手动 workflow_dispatch → 完整流水线（可选指定分支）
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: '部署目标分支'
        required: true
        default: 'main'

# 防止并发部署，新运行会取消进行中的旧运行
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# 共享的环境变量，所有步骤均可访问
env:
  NODE_VERSION: '20'
  # D1 数据库名称（部署时覆盖 wrangler.jsonc 默认值）
  D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'zenglance-db' }}
  # 生产环境前端地址（部署时覆盖 vars 默认值，本地开发不受影响）
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://zenglance.example.com' }}
  # B2 API 端点（默认 https://api.backblazeb2.com）
  B2_API_URL: ${{ vars.B2_API_URL || 'https://api.backblazeb2.com' }}
  # Valcorner OAuth 端点（生产环境按需覆盖）
  VALCORNER_REDIRECT_URI: ${{ vars.VALCORNER_REDIRECT_URI || 'https://zenglance.example.com/auth/callback' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc 中 database_id 是占位符：
      # - 有 D1_DATABASE_ID secret 时用真实 ID（部署分支）
      # - 无 secret 时用占位 UUID（测试分支），让 miniflare 测试仍能通过
      - name: Inject D1 database_id for tests
        env:
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          DB_ID="${DB_ID:-00000000-0000-0000-0000-000000000000}"
          sed -i "s/\"YOUR_D1_DATABASE_ID\"/\"$DB_ID\"/" wrangler.jsonc
          echo "D1 database_id: $DB_ID"

      - name: Run tests
        run: npm test -- --run

  verify-secrets:
    name: Verify Deployment Secrets
    # 仅在部署分支或手动触发时运行
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          VALCORNER_CLIENT_ID: ${{ secrets.VALCORNER_CLIENT_ID }}
          VALCORNER_CLIENT_SECRET: ${{ secrets.VALCORNER_CLIENT_SECRET }}
        run: |
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID \
                     B2_APPLICATION_KEY_ID B2_APPLICATION_KEY \
                     VALCORNER_CLIENT_ID VALCORNER_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "::error::部署失败：缺少必需的 GitHub secrets。"
            echo "::error::请前往仓库 Settings → Secrets and variables → Actions 配置以下 secrets："
            echo "::error::  CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、D1_DATABASE_ID"
            echo "::error::  B2_APPLICATION_KEY_ID、B2_APPLICATION_KEY"
            echo "::error::  VALCORNER_CLIENT_ID、VALCORNER_CLIENT_SECRET"
            echo "::error::详见 README.md → GitHub Actions Deployment"
            exit 1
          fi
          echo "All required secrets are configured ✅"

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, verify-secrets]
    # verify-secrets 只在部署分支运行，非部署分支时 needs 不满足则跳过整个 job
    if: always() && (needs.test.result == 'success') &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || needs.verify-secrets.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 注入真实 D1_DATABASE_ID（部署分支）
      - name: Inject D1 database_id
        if: secrets.D1_DATABASE_ID != ''
        env:
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/\"YOUR_D1_DATABASE_ID\"/\"$DB_ID\"/" wrangler.jsonc
          echo "Injected real D1 database_id: $DB_ID"

      # D1 migrations：CREATE TABLE IF NOT EXISTS 保证幂等，重复运行安全
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute ${{ env.D1_DATABASE_NAME }} --remote --file=migrations/0001_initial.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 自动将仓库 GitHub secrets 同步为 Wrangler secrets（无需手动列名）
          secrets: sync
        env:
          # --- Secrets（来自 GitHub secrets）---
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          VALCORNER_CLIENT_ID: ${{ secrets.VALCORNER_CLIENT_ID }}
          VALCORNER_CLIENT_SECRET: ${{ secrets.VALCORNER_CLIENT_SECRET }}
          # --- Vars（生产环境覆盖，可从 GitHub vars 配置；未配置则用 workflow env 默认值）---
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          B2_API_URL: ${{ env.B2_API_URL }}
          VALCORNER_REDIRECT_URI: ${{ env.VALCORNER_REDIRECT_URI }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Deployment successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Frontend**: ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

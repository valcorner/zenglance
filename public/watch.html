<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.titleWatch">Watch — Video</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .watch-page {
      display: flex;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
      align-items: flex-start;
    }
    html[dir="rtl"] .watch-page { flex-direction: row-reverse; }

    /* ── Main column ─────────────────────────────────────────────── */
    .watch-main { flex: 1; min-width: 0; }

    .watch-player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .watch-player-wrapper video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    .watch-player-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; color: rgba(255,255,255,0.3);
    }
    .watch-player-placeholder svg { width: 64px; height: 64px; opacity: 0.4; }

    /* Custom controls overlay */
    .watch-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      padding: 2rem 12px 10px;
      display: flex; align-items: flex-end; gap: 10px;
      opacity: 0; transition: opacity 0.3s;
    }
    .watch-player-wrapper:hover .watch-controls { opacity: 1; }
    .watch-play-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border: none; border-radius: 50%;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .watch-seek-bar {
      flex: 1; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; cursor: pointer;
      position: relative;
    }
    .watch-seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%; cursor: pointer;
    }
    .watch-time { font-size: 11px; color: rgba(255,255,255,0.7); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .watch-volume-btn {
      width: 32px; height: 32px;
      background: none; border: none; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .watch-volume-bar {
      width: 70px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; cursor: pointer;
    }
    .watch-volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%; cursor: pointer;
    }

    .watch-title {
      font-size: 1.25rem; font-weight: 700;
      margin: 1rem 0 0.5rem;
      line-height: 1.4;
    }
    .watch-meta {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 0.75rem; margin-bottom: 1rem;
      font-size: 13px; color: var(--text-secondary);
    }
    .watch-meta-tag {
      background: var(--bg-hover);
      padding: 3px 10px; border-radius: 4px;
      font-size: 12px; color: var(--text-muted);
    }
    .watch-description {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-size: 13px; color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .watch-actions {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .watch-action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 7px 14px; border-radius: 20px;
      font-size: 13px; cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }
    .watch-action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .watch-action-btn.active { color: var(--accent); }
    .watch-action-btn svg { width: 16px; height: 16px; }
    .watch-action-count { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .watch-creator-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 1rem 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .watch-creator-avatar {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #7b2fff, #3ea6ff);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .watch-creator-info { flex: 1; min-width: 0; }
    .watch-creator-name { font-size: 14px; font-weight: 600; }
    .watch-creator-subs { font-size: 12px; color: var(--text-muted); }
    .watch-follow-btn {
      background: var(--accent); color: #fff;
      padding: 8px 18px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer;
      transition: background var(--transition);
    }
    .watch-follow-btn.active { background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-secondary); }

    .watch-type-info { font-size: 12px; color: var(--text-muted); margin-bottom: 0.5rem; }
    .watch-type-info span { margin-right: 0.5rem; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .watch-sidebar {
      width: 360px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    html[dir="rtl"] .watch-sidebar { width: 360px; }
    .watch-sidebar-title {
      font-size: 14px; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    .watch-related-item {
      display: flex; gap: 0.6rem;
      padding: 6px; border-radius: var(--radius-md);
      cursor: pointer; transition: background var(--transition);
      text-decoration: none; color: inherit;
    }
    .watch-related-item:hover { background: var(--bg-hover); }
    .watch-related-thumb {
      width: 160px; aspect-ratio: 16/9;
      border-radius: var(--radius-sm);
      overflow: hidden; flex-shrink: 0;
      background: var(--bg-secondary);
      position: relative;
    }
    .watch-related-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .watch-related-duration {
      position: absolute; bottom: 4px; right: 4px;
      background: rgba(0,0,0,0.8); color: #fff;
      font-size: 10px; padding: 1px 4px; border-radius: 3px;
      font-weight: 600;
    }
    html[dir="rtl"] .watch-related-duration { right: auto; left: 4px; }
    .watch-related-info { flex: 1; min-width: 0; }
    .watch-related-title {
      font-size: 13px; font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.3; margin-bottom: 4px;
    }
    .watch-related-creator { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .watch-related-meta { font-size: 11px; color: var(--text-muted); }

    /* ── Comments ────────────────────────────────────────────────── */
    .watch-comments {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin-top: 0.5rem;
    }
    .watch-comments-header {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 15px; font-weight: 700; margin-bottom: 1rem;
    }
    .watch-comments-count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    .watch-comment-input-row {
      display: flex; gap: 0.75rem; margin-bottom: 1rem;
    }
    .watch-comment-input-wrap { flex: 1; }
    .watch-comment-input {
      width: 100%; background: var(--bg-secondary);
      border: 1px solid var(--border-color); border-radius: var(--radius-md);
      color: var(--text-primary); padding: 0.6rem 0.75rem;
      font-size: 13px; resize: none; min-height: 44px;
      transition: border-color var(--transition);
    }
    .watch-comment-input:focus { outline: none; border-color: var(--accent); }
    .watch-comment-post-btn {
      background: var(--accent); color: #fff; border: none;
      padding: 0 1rem; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; align-self: flex-end;
    }
    .watch-comments-list { display: flex; flex-direction: column; gap: 0.75rem; max-height: 400px; overflow-y: auto; }
    .watch-comment-item {
      display: flex; gap: 0.75rem; align-items: flex-start;
    }
    .watch-comment-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .watch-comment-body { flex: 1; min-width: 0; }
    .watch-comment-author { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .watch-comment-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; word-break: break-word; }
    .watch-comment-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .watch-load-more {
      background: none; border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: 6px 16px; border-radius: 20px;
      font-size: 12px; cursor: pointer; margin-top: 0.5rem;
      transition: background var(--transition), color var(--transition);
    }
    .watch-load-more:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .watch-page { flex-direction: column; }
      .watch-sidebar { width: 100%; }
      .watch-player-wrapper { max-width: 100%; }
    }
    @media (max-width: 640px) {
      .watch-player-wrapper { border-radius: 0; margin: -1.5rem -1.5rem 1rem; }
      .watch-title { font-size: 1rem; }
      .watch-sidebar { gap: 0.5rem; }
    }

    /* ── Collection modal ─────────────────────────────────────────── */
    .watch-collection-modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2000;
      align-items: center; justify-content: center;
    }
    .watch-collection-modal.open { display: flex; }
    .watch-collection-modal-box {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); width: 92%; max-width: 420px;
      padding: 1.25rem; max-height: 80vh; display: flex; flex-direction: column;
    }
    .watch-collection-modal-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: .75rem; }
    .watch-collection-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
    .watch-collection-item {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .65rem; border-radius: var(--radius-md);
      border: 1px solid var(--border-color); cursor: pointer;
      transition: background var(--transition);
    }
    .watch-collection-item:hover { background: var(--bg-hover); }
    .watch-collection-item.in { border-color: var(--accent); background: rgba(0,120,212,.08); }
    .watch-collection-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
    .watch-collection-item-label { flex: 1; font-size: 14px; font-weight: 500; }
    .watch-collection-item-count { font-size: 12px; color: var(--text-muted); }
    .watch-collection-new {
      margin-top: .5rem; display: flex; gap: .5rem;
    }
    .watch-collection-new input {
      flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); color: var(--text-primary);
      padding: .45rem .65rem; font-size: 13px;
    }
    .watch-collection-new input:focus { outline: none; border-color: var(--accent); }
    .watch-collection-new button {
      background: var(--accent); color: #fff; border: none;
      padding: .45rem .9rem; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .watch-collection-modal-footer {
      display: flex; gap: .5rem; justify-content: flex-end; margin-top: .75rem;
    }
    .watch-collection-modal-footer button {
      padding: .45rem 1rem; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .watch-collection-modal-footer .btn-save { background: var(--accent); color: #fff; border: none; }
    .watch-collection-modal-footer .btn-cancel { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); }
    .btn-cancel { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: .45rem 1rem; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--accent); color: #fff; border: none; padding: .45rem 1rem; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; }

    /* ── Episode navigation ──────────────────────────────────────── */
    .watch-episode-nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; padding: .75rem 0; margin-top: .5rem;
      border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .watch-episode-nav-left, .watch-episode-nav-right { display: flex; align-items: center; gap: .5rem; }
    .watch-ep-nav-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .4rem .85rem; border-radius: var(--radius-md);
      border: 1px solid var(--border-color); background: var(--bg-card);
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: background var(--transition);
    }
    .watch-ep-nav-btn:hover:not(:disabled) { background: var(--bg-hover); }
    .watch-ep-nav-btn:disabled { opacity: .4; cursor: not-allowed; }
    .watch-ep-nav-btn svg { width: 14px; height: 14px; }
    .watch-ep-nav-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .watch-ep-list-btn {
      background: none; border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: .35rem .75rem;
      border-radius: var(--radius-md); font-size: 12px; cursor: pointer;
      transition: background var(--transition);
    }
    .watch-ep-list-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .watch-ep-list-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 2000;
      align-items: center; justify-content: center;
    }
    .watch-ep-list-modal.open { display: flex; }
    .watch-ep-list-box {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); width: 92%; max-width: 520px;
      max-height: 80vh; display: flex; flex-direction: column;
    }
    .watch-ep-list-box h3 { font-size: 1rem; font-weight: 700; padding: 1rem 1.25rem .75rem; border-bottom: 1px solid var(--border-color); }
    .watch-ep-list { flex: 1; overflow-y: auto; }
    .watch-ep-item {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem 1.25rem; border-bottom: 1px solid var(--border-color);
      text-decoration: none; color: var(--text-primary); transition: background var(--transition);
    }
    .watch-ep-item:hover { background: var(--bg-hover); }
    .watch-ep-item.current { background: rgba(0,120,212,.1); border-left: 3px solid var(--accent); }
    .watch-ep-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-secondary); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--text-muted); flex-shrink: 0;
    }
    .watch-ep-item.current .watch-ep-num { background: var(--accent); color: #fff; }
    .watch-ep-info { flex: 1; min-width: 0; }
    .watch-ep-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .watch-ep-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .watch-ep-list-footer {
      padding: .75rem 1.25rem; border-top: 1px solid var(--border-color);
      display: flex; justify-content: flex-end; gap: .5rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text">Video</span>
      </a>
    </div>
    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search..." />
      </div>
    </div>
    <div class="header-right">
      <button class="watch-back-btn" onclick="history.back()">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meta.back">Back</span>
      </button>
      <div class="lang-wrapper">
        <button class="lang-btn" id="langBtn" aria-label="Change language">
          <span>GB</span>
          <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
          <button class="lang-option" data-lang="fr" data-lang-label="Fran\u00E7ais"><span>FR</span> Fran\u00E7ais</button>
          <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
          <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
          <button class="lang-option" data-lang="es" data-lang-label="Espa\u00F1ol"><span>ES</span> Espa\u00F1ol</button>
          <button class="lang-option" data-lang="ar" data-lang-label="\u0627\u0644\u0639\u0631\u0628\u064A\u0629"><span>SA</span> \u0627\u0644\u0639\u0631\u0628\u064A\u0629</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Page content -->
  <div class="watch-page" style="margin-top:calc(var(--header-h) + 1rem)">
    <!-- Main: player + info -->
    <div class="watch-main">
      <div class="watch-player-wrapper" id="playerWrapper">
        <div class="watch-player-placeholder" id="playerPlaceholder">
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="8" y="14" width="48" height="36" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M26 32l12 8-12 8V32z" fill="currentColor"/>
          </svg>
          <span data-i18n="status.loading">Loading...</span>
        </div>
        <video id="watchVideo" style="display:none" playsinline></video>
        <div class="watch-controls" id="watchControls">
          <button class="watch-play-btn" id="watchPlayBtn" onclick="toggleWatchPlay()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <input type="range" class="watch-seek-bar" id="watchSeekBar" min="0" max="100" value="0" oninput="watchSeek(this.value)" />
          <span class="watch-time" id="watchCurrentTime">0:00</span>
          <span class="watch-time" id="watchDuration">0:00</span>
          <button class="watch-volume-btn" id="watchMuteBtn" onclick="toggleWatchMute()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input type="range" class="watch-volume-bar" id="watchVolumeBar" min="0" max="100" value="80" oninput="watchSetVolume(this.value)" />
          <button class="watch-play-btn" onclick="watchToggleFullscreen()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <h1 class="watch-title" id="watchTitle" data-i18n="player.loadingTitle">Loading...</h1>
      <div class="watch-meta" id="watchMeta"></div>
      <div class="watch-type-info" id="watchTypeInfo" style="display:none;font-size:12px;color:var(--text-muted);margin-bottom:.5rem"></div>
      <div class="watch-actions">
        <button class="watch-action-btn" id="watchLikeBtn" onclick="toggleLike()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="watchLikeLabel" data-i18n="interactions.like">Like</span>
          <span id="watchLikeCount" class="watch-action-count"></span>
        </button>
        <button class="watch-action-btn" id="watchSaveBtn" onclick="toggleSave()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="watchSaveLabel" data-i18n="interactions.save">Save</span>
          <span id="watchSaveCount" class="watch-action-count"></span>
        </button>
        <button class="watch-action-btn" onclick="watchShare()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" stroke="currentColor" stroke-width="1.8"/><polyline points="16 6 12 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="2" x2="12" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="interactions.share">Share</span>
        </button>
        <button class="watch-action-btn" id="watchCollectionBtn" onclick="openCollectionModal()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h4a2 2 0 012 2v0a2 2 0 01-2 2H6a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8"/><path d="M4 12a2 2 0 012-2h4a2 2 0 012 2v0a2 2 0 01-2 2H6a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8"/><path d="M14 4h4a2 2 0 012 2v0a2 2 0 01-2 2h-4a2 2 0 01-2-2v0a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/><path d="M14 10h4a2 2 0 012 2v0a2 2 0 01-2 2h-4a2 2 0 01-2-2v0a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="collection.addToCollection">Add to Collection</span>
        </button>
      </div>
      <div class="watch-creator-bar" id="watchCreatorBar">
        <div class="watch-creator-avatar" id="watchCreatorAvatar">U</div>
        <div class="watch-creator-info">
          <div class="watch-creator-name" id="watchCreatorName">Unknown Creator</div>
          <div class="watch-creator-subs" id="watchCreatorSubs"></div>
        </div>
        <button class="watch-follow-btn" id="watchFollowBtn" onclick="toggleFollow()">Follow</button>
      </div>
      <div class="watch-description" id="watchDescription"></div>
      <div id="watchAdContainer"></div>
      <div id="watchEpisodeNav" class="watch-episode-nav" style="display:none"></div>

      <!-- Comments section -->
      <div class="watch-comments" id="watchComments">
        <div class="watch-comments-header">
          <span data-i18n="interactions.comments">Comments</span>
          <span class="watch-comments-count" id="watchCommentsCount"></span>
        </div>
        <div class="watch-comment-input-row" id="watchCommentInputRow">
          <div class="watch-comment-input-wrap">
            <textarea class="watch-comment-input" id="watchCommentInput" data-i18n-placeholder="interactions.addComment" placeholder="Add a comment..."></textarea>
          </div>
          <button class="watch-comment-post-btn" id="watchCommentPostBtn" onclick="postComment()" data-i18n="interactions.post">Post</button>
        </div>
        <div class="watch-comments-list" id="watchCommentsList"></div>
        <button class="watch-load-more" id="watchCommentsLoadMore" style="display:none" onclick="loadMoreComments()" data-i18n="interactions.loadMore">Load More</button>
      </div>
    </div>

    <!-- Sidebar: related videos -->
    <aside class="watch-sidebar">
      <div class="watch-sidebar-title" data-i18n="meta.related">Related Videos</div>
      <div id="watchRelatedList"></div>
    </aside>
  </div>

  <script src="i18n.js?v=12"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <script>
    (function() {
      'use strict';

      var video = document.getElementById('watchVideo');
      var placeholder = document.getElementById('playerPlaceholder');
      var controls = document.getElementById('watchControls');
      var playBtn = document.getElementById('watchPlayBtn');
      var seekBar = document.getElementById('watchSeekBar');
      var currentTimeEl = document.getElementById('watchCurrentTime');
      var durationEl = document.getElementById('watchDuration');
      var titleEl = document.getElementById('watchTitle');
      var metaEl = document.getElementById('watchMeta');
      var descEl = document.getElementById('watchDescription');
      var creatorName = document.getElementById('watchCreatorName');
      var creatorAvatar = document.getElementById('watchCreatorAvatar');
      var relatedList = document.getElementById('watchRelatedList');

      var currentLang = 'en';
      if (window.i18n && window.i18n.getLang) currentLang = window.i18n.getLang();

      function t(key, params) {
        if (window.i18n && window.i18n.t) return window.i18n.t(key, params);
        var TRANSLATIONS = { meta: { back:{en:'Back'}, like:{en:'Like'}, share:{en:'Share'}, save:{en:'Save'}, follow:{en:'Follow'}, related:{en:'Related Videos'}, notifications:{en:'Notifications'}, profile:{en:'Profile'} }, status:{loading:{en:'Loading...'}}, player:{loadingTitle:{en:'Loading...'}, unknownCreator:{en:'Unknown Creator'}, views:{en:'views'} } };
        var parts = key.split('.');
        var obj = TRANSLATIONS;
        for (var i = 0; i < parts.length; i++) { obj = obj[parts[i]]; if (!obj) return key; }
        return (obj[currentLang] || obj.en || key);
      }

      function escapeHtml(str) {
        if (!str) return '';
        var d = document.createElement('div'); d.textContent = str;
        return d.innerHTML;
      }

      function formatViews(n) {
        if (!n) return '';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(n);
      }

      function formatDuration(seconds) {
        if (!seconds) return '';
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return m + ':' + s.toString().padStart(2, '0');
      }

      function timeAgo(iso) {
        if (!iso) return '';
        var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (diff < 60) return t('timeAgo.justNow');
        if (diff < 3600) return t('timeAgo.minutesAgo', { n: Math.floor(diff / 60) });
        if (diff < 86400) return t('timeAgo.hoursAgo', { n: Math.floor(diff / 3600) });
        if (diff < 2592000) return t('timeAgo.daysAgo', { n: Math.floor(diff / 86400) });
        if (diff < 31536000) return t('timeAgo.monthsAgo', { n: Math.floor(diff / 2592000) });
        return t('timeAgo.yearsAgo', { n: Math.floor(diff / 31536000) });
      }

      // ── Language selector ─────────────────────────────────────────
      function buildLangSelector() {
        var btn = document.getElementById('langBtn');
        var dropdown = document.getElementById('langDropdown');
        if (!btn || !dropdown) return;
        dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdown.classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
          if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.classList.remove('show');
          }
        });
        document.querySelectorAll('.lang-option').forEach(function(opt) {
          opt.addEventListener('click', function(e) {
            e.stopPropagation();
            if (window.i18n) window.i18n.setLang(opt.dataset.lang);
            dropdown.classList.remove('show');
          });
        });
      }

      // ── Player controls ───────────────────────────────────────────
      var PLAY_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      var PAUSE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

      window.toggleWatchPlay = function() {
        var btn = document.getElementById('watchPlayBtn');
        if (video.paused) {
          video.play();
          if (btn) btn.innerHTML = PAUSE_ICON;
        } else {
          video.pause();
          if (btn) btn.innerHTML = PLAY_ICON;
        }
      };

      window.watchSeek = function(val) {
        if (video.duration) video.currentTime = (val / 100) * video.duration;
      };

      window.toggleWatchMute = function() {
        video.muted = !video.muted;
      };

      window.watchSetVolume = function(val) {
        video.volume = val / 100;
      };

      window.watchToggleFullscreen = function() {
        var wrapper = document.getElementById('playerWrapper');
        if (!wrapper) return;
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (document.webkitFullscreenElement) {
          document.webkitExitFullscreen();
        } else if (wrapper.requestFullscreen) {
          wrapper.requestFullscreen();
        } else if (wrapper.webkitRequestFullscreen) {
          wrapper.webkitRequestFullscreen();
        }
      };

      video.addEventListener('loadedmetadata', function() {
        if (durationEl) durationEl.textContent = formatTime(video.duration);
      });

      // ── Watch history auto-record ───────────────────────────────────
      var _historyUserKey = null;
      function _getHistoryKey() {
        if (_historyUserKey) return Promise.resolve(_historyUserKey);
        var token = localStorage.getItem('video_token');
        if (!token) return Promise.reject();
        return fetch('/api/interaction/history/key', {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(r) { return r.json(); }).then(function(d) {
          if (d.key) { _historyUserKey = d.key; return d.key; }
          return Promise.reject();
        });
      }
      var _historyRecordingTimer = null;
      function _recordHistoryProgress() {
        if (!currentVideoId || !currentContentType) return;
        var token = localStorage.getItem('video_token');
        if (!token) return;
        var deviceId = watchHistoryCrypto.getDeviceId();
        var progress = { position: video.currentTime, duration: video.duration || 0 };
        _getHistoryKey()
          .then(function(key) {
            return watchHistoryCrypto.encryptProgress(key, progress);
          })
          .then(function(enc) {
            navigator.sendBeacon('/api/interaction/history/record', JSON.stringify({
              contentId: currentVideoId,
              deviceId: deviceId,
              watchedAt: Date.now(),
              encryptedProgress: enc.data,
              progressIv: enc.iv,
              progressAuthTag: enc.tag
            }));
          }).catch(function() {});
      }
      var _historySendTimer = null;
      video.addEventListener('timeupdate', function() {
        var pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
        if (seekBar) seekBar.value = pct;
        if (currentTimeEl) currentTimeEl.textContent = formatTime(video.currentTime);
        clearTimeout(_historySendTimer);
        _historySendTimer = setTimeout(_recordHistoryProgress, 30000);
      });
      window.addEventListener('beforeunload', function() {
        clearTimeout(_historySendTimer);
        _recordHistoryProgress();
        var token = localStorage.getItem('video_token');
        if (token && currentVideoId) {
          navigator.sendBeacon('/api/interaction/history/record', JSON.stringify({
            contentId: currentVideoId,
            deviceId: watchHistoryCrypto.getDeviceId(),
            watchedAt: Date.now()
          }));
        }
      });

      // ── Streaming player setup ────────────────────────────────────
      var hlsPlayer = null;
      var dashPlayer = null;
      var currentVideoId = null, currentCreatorId = null;
      var currentCdn = null;
      var currentContentType = null;
      var likeCount = 0, saveCount = 0, isLiked = false, isSaved = false, isFollowing = false;
      var commentCursor = null, loadingComments = false;

      function _getTicket() {
        var tokenUrl = (currentCdn && currentCdn.tokenUrl) || 'https://cdn.valcorner.qzz.io/api/token';
        return fetch(tokenUrl, { signal: AbortSignal.timeout(5000) })
          .then(function(r) { return r.json(); })
          .then(function(d) { return d.ticket; });
      }

      function _injectTicket(url, ticket) {
        return url.replace('{ticket}', ticket);
      }

      function _isHls(url) { return /\.m3u8(\?.*)?$/i.test(url); }
      function _isDash(url) { return /\.mpd(\?.*)?$/i.test(url); }
      function _isMp4(url) { return /\.mp4(\?.*)?$/i.test(url); }

      function _cleanupPlayer() {
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }
        video.src = '';
        video.load();
      }

      function _setupPlayer(cdn) {
        _cleanupPlayer();
        currentCdn = cdn;
        placeholder.style.display = 'none';
        video.style.display = 'block';

        var manifestUrl = cdn && cdn.manifestUrl;
        var directUrl   = cdn && cdn.directUrl;
        var needsTicket = cdn && cdn.requiresTicket !== false;

        if (!manifestUrl && !directUrl) {
          placeholder.style.display = 'flex';
          placeholder.innerHTML =
            '<div style="text-align:center"><div style="font-size:48px;margin-bottom:12px;opacity:0.3">⬡</div><p style="color:rgba(255,255,255,0.5)">' + t('player.noPreview') + '</p></div>';
          return;
        }

        // For URL-based content, ticket is obtained first, then injected into URL
        function _playUrls(ticket) {
          // ── HLS (.m3u8) ──────────────────────────────────────────────
          if (manifestUrl && _isHls(manifestUrl)) {
            var hlsUrl = ticket ? _injectTicket(manifestUrl, ticket) : manifestUrl;
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
              hlsPlayer = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60 });
              hlsPlayer.loadSource(hlsUrl);
              hlsPlayer.attachMedia(video);
              hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
              hlsPlayer.on(Hls.Events.ERROR, function(e, info) {
                if (info.fatal) {
                  console.warn('HLS fatal error, falling back to native:', info.type, info.details);
                  if (directUrl) {
                    video.src = ticket ? _injectTicket(directUrl, ticket) : directUrl;
                    video.play();
                  }
                }
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = hlsUrl;
              video.play();
            } else {
              placeholder.innerHTML = '<p style="color:rgba(255,255,255,0.5)">HLS not supported</p>';
            }
            return;
          }

          // ── DASH (.mpd) ──────────────────────────────────────────────
          if (manifestUrl && _isDash(manifestUrl)) {
            var dashUrl = ticket ? _injectTicket(manifestUrl, ticket) : manifestUrl;
            if (typeof dashjs !== 'undefined' && dashjs) {
              dashPlayer = dashjs.MediaPlayer().create();
              dashPlayer.initialize(video, dashUrl, true);
              dashPlayer.getDebug().setLogToBrowserConsole(false);
            } else {
              video.src = dashUrl;
              video.play();
            }
            return;
          }

          // ── Direct MP4 / WebM ────────────────────────────────────────
          var srcUrl = directUrl || manifestUrl;
          video.src = ticket ? _injectTicket(srcUrl, ticket) : srcUrl;
          video.play();
        }

        if (needsTicket) {
          _getTicket().then(_playUrls).catch(function(err) {
            console.error('Failed to get CDN ticket:', err);
            placeholder.style.display = 'flex';
            placeholder.innerHTML = '<p style="color:rgba(255,255,255,0.5)">' + t('status.loadFailed') + '</p>';
          });
        } else {
          _playUrls(null);
        }
      }

      function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      async function loadVideo(id) {
        var token = localStorage.getItem('video_token');
        var apiUrl = '/api/content/' + id;
        var res = await fetch(apiUrl, {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) {
          placeholder.style.display = 'flex';
          placeholder.innerHTML = '<p style="color:rgba(255,255,255,0.5)">' + t('status.notFound') + '</p>';
          return;
        }
        var data = await res.json();
        renderPlayer(data, id);
      }

      function renderPlayer(data, contentId) {
        var cdn = data.cdn;
        if (!cdn) {
          placeholder.style.display = 'flex';
          placeholder.innerHTML = '<p style="color:rgba(255,255,255,0.5)">' + t('status.noData') + '</p>';
          return;
        }

        titleEl.textContent = data.title || t('player.unknownTitle');
        var description = data.description;
        descEl.textContent = description || '';

        var metaEl = document.getElementById('watchMeta');
        var genre = data.genre, director = data.director;
        var season = data.season, totalEpisodes = data.totalEpisodes;
        var seriesStatus = data.seriesStatus, rating = data.rating;
        var platform = data.platform;
        var views = data.views, duration = data.duration, contentType = data.contentType;
        currentContentType = contentType;

        metaEl.innerHTML =
          (contentType ? '<span class="watch-meta-tag">' + escapeHtml(t('category.' + contentType)) + '</span>' : '') +
          (views ? '<span>' + formatViews(views) + ' ' + t('player.views') + '</span>' : '') +
          (duration ? '<span>' + formatDuration(duration) + '</span>' : '') +
          (genre ? '<span class="watch-meta-tag">' + escapeHtml(genre) + '</span>' : '') +
          (director ? '<span>' + escapeHtml(director) + '</span>' : '');

        var typeInfoEl = document.getElementById('watchTypeInfo');
        if (typeInfoEl) {
          var parts = [];
          if (season != null) parts.push(t('player.season') + ' ' + season);
          if (totalEpisodes) parts.push(totalEpisodes + ' ' + t('player.episodes'));
          if (seriesStatus) parts.push(t('player.status.' + seriesStatus) || seriesStatus);
          if (rating) parts.push(t('player.rating') + ' ' + rating);
          if (platform) parts.push('@' + platform);
          typeInfoEl.textContent = parts.join('  \u00B7  ');
          typeInfoEl.style.display = parts.length ? '' : 'none';
        }

        var creator = data.creator;
        var creatorName = document.getElementById('watchCreatorName');
        var creatorAvatar = document.getElementById('watchCreatorAvatar');
        if (creator) {
          creatorName.textContent = creator.name || t('player.unknownCreator');
          creatorAvatar.textContent = (creator.name || 'U').charAt(0).toUpperCase();
        } else {
          creatorName.textContent = t('player.unknownCreator');
          creatorAvatar.textContent = 'U';
        }

        _setupPlayer(cdn);
        loadRelated(contentType);
        loadInteractions(contentId, creator && creator.id ? creator.id : null);
        loadComments(contentId);
        loadAd(contentType);
        // Load series episodes for navigation if seriesSlug exists
        if (seriesSlug) {
          _currentSeriesSlug = seriesSlug;
          loadEpisodes(seriesSlug, episodeNumber);
        }
      }

      function loadInteractions(contentId, creatorId) {
        currentVideoId = contentId;
        currentCreatorId = creatorId;
        var token = localStorage.getItem('video_token');
        if (token) {
          Promise.all([
            fetch('/api/interaction/content/' + contentId + '/likes', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r){ return r.json(); }),
            fetch('/api/interaction/content/' + contentId + '/favorite', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r){ return r.json(); }),
          ]).then(function(results) {
            likeCount = results[0].likeCount || 0;
            isLiked = results[0].isLiked || false;
            saveCount = results[1].favoriteCount || 0;
            isSaved = results[1].isFavorite || false;
            updateLikeUI();
            updateSaveUI();
          }).catch(function(e) { console.error(e); });
          if (creatorId) {
            fetch('/api/interaction/users/' + creatorId + '/followers', {
              headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            })
              .then(function(r) { return r.json(); })
              .then(function(d) {
                isFollowing = d.following || false;
                updateFollowUI(d.followerCount || 0);
              })
              .catch(function(e) { console.error(e); updateFollowUI(0); });
          }
        }
      }

      function updateLikeUI() {
        var btn = document.getElementById('watchLikeBtn');
        var label = document.getElementById('watchLikeLabel');
        var count = document.getElementById('watchLikeCount');
        if (!btn) return;
        btn.classList.toggle('active', isLiked);
        label.textContent = isLiked ? t('interactions.unlike') : t('interactions.like');
        count.textContent = likeCount ? ' ' + likeCount : '';
      }

      function updateSaveUI() {
        var btn = document.getElementById('watchSaveBtn');
        var label = document.getElementById('watchSaveLabel');
        var count = document.getElementById('watchSaveCount');
        if (!btn) return;
        btn.classList.toggle('active', isSaved);
        label.textContent = isSaved ? t('interactions.saved') : t('interactions.save');
        count.textContent = saveCount ? ' ' + saveCount : '';
      }

      function updateFollowUI(followerCount) {
        var btn = document.getElementById('watchFollowBtn');
        if (!btn) return;
        btn.textContent = isFollowing ? t('interactions.followed') : t('interactions.follow');
        btn.classList.toggle('active', isFollowing);
        var subsEl = document.getElementById('watchCreatorSubs');
        if (subsEl) subsEl.textContent = followerCount ? formatFollowers(followerCount) + ' ' + t('interactions.followers') : '';
      }

      function formatFollowers(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
        return String(n);
      }

      async function toggleLike() {
        var token = localStorage.getItem('video_token');
        if (!token) { alert(t('status.loginFirst')); return; }
        if (!currentVideoId) return;
        isLiked = !isLiked;
        likeCount += isLiked ? 1 : -1;
        updateLikeUI();
        fetch('/api/interaction/content/' + currentVideoId + '/like', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
        }).catch(function(e) { isLiked = !isLiked; likeCount += isLiked ? 1 : -1; updateLikeUI(); });
      }

      async function toggleSave() {
        var token = localStorage.getItem('video_token');
        if (!token) { alert(t('status.loginFirst')); return; }
        if (!currentVideoId) return;
        isSaved = !isSaved;
        saveCount += isSaved ? 1 : -1;
        updateSaveUI();
        fetch('/api/interaction/content/' + currentVideoId + '/favorite', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
        }).catch(function(e) { isSaved = !isSaved; saveCount += isSaved ? 1 : -1; updateSaveUI(); });
      }

      async function toggleFollow() {
        var token = localStorage.getItem('video_token');
        if (!token) { alert(t('status.loginFirst')); return; }
        if (!currentCreatorId) return;
        isFollowing = !isFollowing;
        updateFollowUI();
        fetch('/api/interaction/users/' + currentCreatorId + '/follow', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
        }).catch(function(e) { isFollowing = !isFollowing; updateFollowUI(); });
      }

      // ── Comments ──────────────────────────────────────────────────
      async function loadComments(contentId, append) {
        if (!contentId || loadingComments) return;
        loadingComments = true;
        var token = localStorage.getItem('video_token');
        var listEl = document.getElementById('watchCommentsList');
        var loadMoreBtn = document.getElementById('watchCommentsLoadMore');
        if (!append) listEl.innerHTML = '<p style="color:var(--text-muted);padding:.5rem 0">' + t('collection.loading') + '</p>';
        try {
          var params = 'limit=20';
          if (commentCursor) params += '&cursor=' + commentCursor;
          var headers = {};
          if (token) headers['Authorization'] = 'Bearer ' + token;
          var res = await fetch('/api/interaction/content/' + contentId + '/comments?' + params, {
            headers: headers
          });
          var data = await res.json();
          var comments = data.comments || [];
          if (!append) listEl.innerHTML = '';
          if (!append) commentCursor = null;
          if (data.nextCursor) commentCursor = data.nextCursor;
          if (loadMoreBtn) loadMoreBtn.style.display = commentCursor ? '' : 'none';
          if (!comments.length && !append) {
            listEl.innerHTML = '<p style="color:var(--text-muted);padding:.5rem 0;font-size:13px">' + t('status.noData') + '</p>';
          }
          comments.forEach(function(c) { listEl.appendChild(renderComment(c)); });
        } catch (e) { console.error(e); }
        loadingComments = false;
      }

      function renderComment(c) {
        var div = document.createElement('div');
        div.className = 'watch-comment-item';
        div.innerHTML =
          '<div class="watch-comment-avatar">' + (c.user ? c.user.charAt(0).toUpperCase() : 'U') + '</div>' +
          '<div class="watch-comment-body">' +
            '<div class="watch-comment-author">' + escapeHtml(c.user || 'Unknown') + '</div>' +
            '<div class="watch-comment-text">' + escapeHtml(c.body) + '</div>' +
            '<div class="watch-comment-meta">' + timeAgo(c.createdAt) + '</div>' +
          '</div>';
        return div;
      }

      function loadMoreComments() {
        if (currentVideoId) loadComments(currentVideoId, true);
      }
      window.loadMoreComments = loadMoreComments;

      function postComment() {
        var token = localStorage.getItem('video_token');
        if (!token) { alert(t('status.loginFirst')); return; }
        var input = document.getElementById('watchCommentInput');
        if (!input || !input.value.trim()) return;
        if (!currentVideoId) return;
        var body = input.value.trim();
        var postBtn = document.getElementById('watchCommentPostBtn');
        if (postBtn) { postBtn.disabled = true; postBtn.textContent = t('interactions.auditing') || 'Auditing…'; }
        fetch('/api/interaction/content/' + currentVideoId + '/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ body: body })
        }).then(function(r) {
          if (r.status === 422) {
            // Content rejected by safety audit
            return r.json().then(function(data) {
              if (data.code === 'UNSAFE_CONTENT') {
                alert(t('interactions.commentRejected') || 'Your comment was rejected by content safety audit.');
              } else {
                alert(t('interactions.commentFailed') || 'Failed to post comment.');
              }
              throw new Error('REJECTED');
            });
          }
          if (!r.ok) throw new Error('Failed to post comment');
          return r.json();
        }).then(function(c) {
          input.value = '';
          var listEl = document.getElementById('watchCommentsList');
          if (listEl) listEl.insertBefore(renderComment(c), listEl.firstChild);
        }).catch(function(e) {
          if (e.message !== 'REJECTED') console.error(e);
        }).finally(function() {
          if (postBtn) { postBtn.disabled = false; postBtn.textContent = t('interactions.post') || 'Post'; }
        });
      }
      window.postComment = postComment;

      // ── Ad serving ──────────────────────────────────────────────────
      async function loadAd(contentType) {
        var container = document.getElementById('watchAdContainer');
        if (!container) return;
        var token = localStorage.getItem('video_token');
        var userId = token ? '' : '';
        try {
          var res = await fetch('/api/ads/serve?type=' + encodeURIComponent(contentType) + '&device_id=client-' + Date.now());
          if (!res.ok) return;
          var data = await res.json();
          var ad = data.ad;
          if (!ad) { container.innerHTML = ''; return; }
          var mediaHtml = ad.image_url
            ? '<img src="' + escapeHtml(ad.image_url) + '" alt="">'
            : '<span>\u25B6</span>';
          container.innerHTML =
            '<a class="watch-ad" href="' + escapeHtml(ad.target_url || '#') + '" target="_blank" rel="noopener" onclick="recordAdClick(' + ad.id + ')">' +
              '<div class="watch-ad-label">Sponsored</div>' +
              '<div class="watch-ad-body">' +
                '<div class="watch-ad-media">' + mediaHtml + '</div>' +
                '<div class="watch-ad-text">' +
                  '<div class="watch-ad-title">' + escapeHtml(ad.title) + '</div>' +
                  (ad.description ? '<div class="watch-ad-desc">' + escapeHtml(ad.description) + '</div>' : '') +
                  '<span class="watch-ad-cta">Learn More</span>' +
                '</div>' +
              '</div>' +
            '</a>';
        } catch (e) { console.error('Ad load failed:', e); }
      }

      function recordAdClick(adId) {
        var deviceId = 'client-' + Date.now();
        fetch('/api/ads/click?ad_id=' + adId + '&device_id=' + encodeURIComponent(deviceId)).catch(function() {});
      }
      window.recordAdClick = recordAdClick;

      function formatTime(seconds) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return m + ':' + s.toString().padStart(2, '0');
      }

      // ── Related videos ────────────────────────────────────────────
      async function loadRelated(category) {
        var token = localStorage.getItem('video_token');
        try {
          var url = category ? '/api/content?type=' + category + '&limit=8' : '/api/content?limit=8';
          var headers = {};
          if (token) headers['Authorization'] = 'Bearer ' + token;
          var res = await fetch(url, { headers: headers });
          var data = await res.json();
          var list = (data.data || []).filter(function(v) { return v.id !== getQueryParam('id'); });
          renderRelated(list);
        } catch (e) { console.error(e); }
      }

      function renderRelated(list) {
        var currentType = getQueryParam('type');
        relatedList.innerHTML = '';
        if (!list.length) {
          relatedList.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:1rem 0">' + t('status.notFound') + '</p>';
          return;
        }
        list.forEach(function(video) {
          var item = document.createElement('a');
          item.className = 'watch-related-item';
          item.href = '/watch.html?id=' + video.id + (currentType ? '&type=' + currentType : '');
          item.innerHTML =
            '<div class="watch-related-thumb">' +
              (video.thumbnail ? '<img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy"/>' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.2)">></div>') +
              (video.duration ? '<span class="watch-related-duration">' + formatDuration(video.duration) + '</span>' : '') +
            '</div>' +
            '<div class="watch-related-info">' +
              '<div class="watch-related-title">' + escapeHtml(video.title) + '</div>' +
              '<div class="watch-related-creator">' + escapeHtml(video.creator && video.creator.name ? video.creator.name : t('player.unknownCreator')) + '</div>' +
              '<div class="watch-related-meta">' +
                (video.views ? formatViews(video.views) + ' ' + t('player.views') + ' &middot;' : '') +
                ' ' + timeAgo(video.created_at) +
              '</div>' +
            '</div>';
          relatedList.appendChild(item);
        });
      }

      // ── Action buttons ────────────────────────────────────────────
      window.toggleLike = toggleLike;
      window.toggleSave = toggleSave;
      window.toggleFollow = toggleFollow;
      window.watchShare = function() {
        var url = window.location.href;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() { alert(t('interactions.share') + ' - ' + t('status.copied')); });
        } else {
          prompt(t('interactions.share') + ':', url);
        }
      };

      // ── Boot ──────────────────────────────────────────────────────
      function init() {
        buildLangSelector();
        var id = getQueryParam('id');
        var type = getQueryParam('type');
        if (!id || !type) { window.location.replace('/index.html'); return; }
        loadVideo(id);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      // ── Episode navigation ─────────────────────────────────────────
      async function loadEpisodes(slug, currentEpisodeNumber) {
        try {
          var res = await fetch('/api/content/series/' + encodeURIComponent(slug));
          var episodes = await res.json();
          if (!Array.isArray(episodes) || !episodes.length) { _currentEpisodes = []; return; }
          _currentEpisodes = episodes;
          renderEpisodeNav(currentEpisodeNumber, episodes);
        } catch (e) { console.error('loadEpisodes failed:', e); }
      }

      function renderEpisodeNav(episodeNumber, episodes) {
        var nav = document.getElementById('watchEpisodeNav');
        if (!nav || !episodes || !episodes.length) { if (nav) nav.style.display = 'none'; return; }
        var idx = episodes.findIndex(function(e) { return e.id === getQueryParam('id'); });
        if (idx < 0) { nav.style.display = 'none'; return; }
        var prevEp = episodes[idx - 1] || null;
        var nextEp = episodes[idx + 1] || null;
        nav.innerHTML =
          '<div class="watch-episode-nav-left">' +
            (prevEp
              ? '<a class="watch-ep-nav-btn" href="/watch.html?id=' + prevEp.id + '&type=' + currentContentType + '">' +
                  '<svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
                  '<span data-i18n="player.prevEpisode">Prev</span>' +
                '</a>'
              : '<span class="watch-ep-nav-btn" disabled><svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="player.prevEpisode">Prev</span></span>') +
          '</div>' +
          '<div class="watch-episode-nav-right">' +
            '<button class="watch-ep-list-btn" onclick="openEpListModal()">' +
              '<svg style="width:12px;height:12px;vertical-align:middle;margin-right:3px" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>' +
              '<span data-i18n="player.allEpisodes">All Episodes</span>' +
            '</button>' +
            (nextEp
              ? '<a class="watch-ep-nav-btn" href="/watch.html?id=' + nextEp.id + '&type=' + currentContentType + '">' +
                  '<span data-i18n="player.nextEpisode">Next</span>' +
                  '<svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
                '</a>'
              : '<span class="watch-ep-nav-btn" disabled><span data-i18n="player.nextEpisode">Next</span><svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>') +
          '</div>';
        nav.style.display = 'flex';
      }

      async function openEpListModal() {
        if (!_currentSeriesSlug || !_currentEpisodes.length) return;
        var modal = document.getElementById('watchEpListModal');
        var list = document.getElementById('watchEpList');
        if (!modal || !list) return;
        var currentId = getQueryParam('id');
        list.innerHTML = '';
        _currentEpisodes.forEach(function(ep) {
          var el = document.createElement('a');
          el.className = 'watch-ep-item' + (ep.id === currentId ? ' current' : '');
          el.href = '/watch.html?id=' + ep.id + '&type=' + currentContentType;
          el.innerHTML =
            '<div class="watch-ep-num">' + (ep.episodeNumber || '?') + '</div>' +
            '<div class="watch-ep-info">' +
              '<div class="watch-ep-title">' + escapeHtml(ep.title) + '</div>' +
              '<div class="watch-ep-meta">' +
                (ep.season ? t('player.season') + ' ' + ep.season + ' · ' : '') +
                (ep.duration ? formatDuration(ep.duration) : '') +
                (ep.views ? ' · ' + formatViews(ep.views) + ' ' + t('player.views') : '') +
              '</div>' +
            '</div>';
          list.appendChild(el);
        });
        modal.classList.add('open');
      }

      function closeEpListModal() {
        var modal = document.getElementById('watchEpListModal');
        if (modal) modal.classList.remove('open');
      }

      window.openEpListModal = openEpListModal;
      window.closeEpListModal = closeEpListModal;

      // ── Collection modal ─────────────────────────────────────────────
      var _collections = [];
      var _contentInCols = new Set();
      var _currentContentId = null;

      async function openCollectionModal() {
        var token = localStorage.getItem('video_token');
        if (!token) { alert(t('status.loginFirst')); return; }
        if (!currentVideoId) return;
        _currentContentId = currentVideoId;
        _contentInCols = new Set();

        // Load user's collections
        try {
          var res = await fetch('/api/interaction/collections', { headers: { 'Authorization': 'Bearer ' + token } });
          var data = await res.json();
          _collections = data.collections || [];
        } catch (e) { _collections = []; }

        // Load which collections already contain this content
        for (var c of _collections) {
          try {
            var r2 = await fetch('/api/interaction/collections/' + c.id, { headers: { 'Authorization': 'Bearer ' + token } });
            var d2 = await r2.json();
            var ids = (d2.contents || []).map(function(x){ return x.id; });
            if (ids.indexOf(currentVideoId) >= 0) _contentInCols.add(c.id);
          } catch(e) {}
        }

        renderCollectionModal();
        document.getElementById('watchCollectionModal').classList.add('open');
      }

      function renderCollectionModal() {
        var list = document.getElementById('watchCollectionList');
        var hint = document.getElementById('watchCollectionHint');
        if (!list) return;
        list.innerHTML = '';
        if (!_collections.length) {
          hint.style.display = 'none';
          list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:.5rem 0">' + t('collection.noCollections') + '</p>';
        } else {
          hint.style.display = '';
          _collections.forEach(function(c) {
            var checked = _contentInCols.has(c.id);
            var el = document.createElement('label');
            el.className = 'watch-collection-item' + (checked ? ' in' : '');
            el.innerHTML =
              '<input type="checkbox" ' + (checked ? 'checked' : '') + ' data-col-id="' + c.id + '">' +
              '<span class="watch-collection-item-label">' + escapeHtml(c.name) + '</span>' +
              '<span class="watch-collection-item-count">' + (c._count || '') + '</span>';
            el.addEventListener('click', function(e) {
              if (e.target.tagName === 'INPUT') return;
              var cb = el.querySelector('input');
              cb.checked = !cb.checked;
              el.classList.toggle('in', cb.checked);
            });
            list.appendChild(el);
          });
        }
        // New collection row
        var newWrap = document.getElementById('watchCollectionNewWrap');
        if (newWrap) newWrap.style.display = 'flex';
      }

      function closeCollectionModal() {
        document.getElementById('watchCollectionModal').classList.remove('open');
      }

      async function saveCollectionSelection() {
        if (!_currentContentId) return;
        var token = localStorage.getItem('video_token');
        var checkboxes = document.querySelectorAll('#watchCollectionList .watch-collection-item input[type=checkbox]');
        for (var i = 0; i < checkboxes.length; i++) {
          var cb = checkboxes[i];
          var colId = cb.dataset.colId;
          var checked = cb.checked;
          var inSet = _contentInCols.has(colId);
          if (checked && !inSet) {
            await fetch('/api/interaction/collections/' + colId + '/items', {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ contentId: _currentContentId })
            }).catch(function(){});
          } else if (!checked && inSet) {
            await fetch('/api/interaction/collections/' + colId + '/items/' + _currentContentId, {
              method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
            }).catch(function(){});
          }
        }
        closeCollectionModal();
        // Show success or already-added message
        var added = Array.from(checkboxes).some(function(cb) { return cb.checked && !_contentInCols.has(cb.dataset.colId); });
        if (added) alert(t('collection.collectionAdded'));
        else alert(t('collection.collectionAlreadyAdded'));
      }

      async function createCollectionFromModal() {
        var input = document.getElementById('watchCollectionNewInput');
        var name = input ? input.value.trim() : '';
        if (!name) return;
        var token = localStorage.getItem('video_token');
        try {
          var res = await fetch('/api/interaction/collections', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ name: name })
          });
          var data = await res.json();
          if (data.id) {
            _collections.push(data);
            renderCollectionModal();
          }
        } catch(e) {}
      }

      window.openCollectionModal = openCollectionModal;
      window.closeCollectionModal = closeCollectionModal;
      window.saveCollectionSelection = saveCollectionSelection;
      window.createCollectionFromModal = createCollectionFromModal;
    })();
  </script>

  <!-- Episode list modal -->
  <div class="watch-ep-list-modal" id="watchEpListModal" onclick="if(event.target===this)closeEpListModal()">
    <div class="watch-ep-list-box">
      <h3 data-i18n="player.allEpisodes">All Episodes</h3>
      <div class="watch-ep-list" id="watchEpList"></div>
      <div class="watch-ep-list-footer">
        <button class="btn-cancel" onclick="closeEpListModal()" data-i18n="interactions.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Collection modal -->
  <div class="watch-collection-modal" id="watchCollectionModal" onclick="if(event.target===this)closeCollectionModal()">
    <div class="watch-collection-modal-box">
      <h3 data-i18n="collection.collectionModalTitle">Add to Collection</h3>
      <p id="watchCollectionHint" class="watch-collection-hint" style="font-size:13px;color:var(--text-muted);margin-bottom:.75rem" data-i18n="collection.collectionSelectHint">Select a collection to save this video:</p>
      <div class="watch-collection-list" id="watchCollectionList"></div>
      <div class="watch-collection-new" id="watchCollectionNewWrap" style="display:none">
        <input id="watchCollectionNewInput" type="text" data-i18n-placeholder="collection.enterCollectionName" placeholder="New collection name..." />
        <button onclick="createCollectionFromModal()" data-i18n="collection.newCollection">+ New Collection</button>
      </div>
      <div class="watch-collection-modal-footer">
        <button class="btn-cancel" onclick="closeCollectionModal()" data-i18n="interactions.cancel">Cancel</button>
        <button class="btn-save" onclick="saveCollectionSelection()" data-i18n="interactions.post">Save</button>
      </div>
    </div>
  </div>
</body>
</html>

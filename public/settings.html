<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — ZenGlance</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="i18n.js?v=13"></script>
  <script>
    (function(){
      const warn = console.warn;
      console.warn = function(...args){
        const msg = args.join(' ');
        if(msg.includes('MaxListenersExceededWarning') || msg.includes('ObjectMultiplex - orphaned data')) return;
        warn.apply(console, args);
      };
    })();
  </script>
  <style>
    /* ── Language selector ─────────────────────────────────────────────────── */
    .lang-wrapper { position: relative; display: inline-block; }
    .lang-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: var(--text-primary);
      font-size: 13px; cursor: pointer; line-height: 1;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.14); }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface-2); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 6px; min-width: 150px;
      z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lang-dropdown.show { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 12px; border: none; background: none;
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      border-radius: 6px; text-align: left;
      transition: background 0.1s, color 0.1s;
    }
    .lang-option:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .lang-option.active { color: var(--accent); font-weight: 600; }

    /* ── RTL adjustments ───────────────────────────────────────────────────── */
    html[dir="rtl"] .lang-dropdown { right: auto; left: 0; }
    html[dir="rtl"] .sidebar { transform: none; }
    html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(8rem); }
    html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 16rem; }
    html[dir="rtl"] .mobile-sidebar-toggle { left: 0.75rem; right: auto; }
    html[dir="rtl"] .dropdown-arrow { transform: rotate(180deg); }
    html[dir="rtl"] .dropdown-arrow.show { transform: rotate(0deg); }
    @media (max-width: 768px) {
      html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(-8rem); }
      html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="mobile-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text" data-i18n="meta.title">ZenGlance</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="meta.search" placeholder="Search content..." />
      </div>
    </div>

    <div class="header-right">
      <!-- Language selector -->
      <div class="lang-wrapper">
        <button class="lang-btn" id="langBtn" aria-label="Change language">
          <span>EN</span>
          <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
          <button class="lang-option" data-lang="fr" data-lang-label="Français"><span>FR</span> Français</button>
          <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
          <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
          <button class="lang-option" data-lang="es" data-lang-label="Español"><span>ES</span> Español</button>
          <button class="lang-option" data-lang="ar" data-lang-label="العربية"><span>SA</span> العربية</button>
        </div>
      </div>

      <button class="upload-btn" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v8M3.5 5.5L7 2l3.5 3.5M2 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meta.upload">Upload</span>
      </button>

      <div class="user-menu" id="userMenu" style="display:none">
        <div class="user-avatar" id="userAvatar">U</div>
        <span class="user-name" id="userName">User</span>
        <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="user-dropdown" id="userDropdown">
          <a href="#" class="dropdown-item" id="profileLink">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1.5 12.5c0-2.5 2-4.5 5.5-4.5s5.5 2 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span data-i18n="meta.profile">Profile</span>
          </a>
          <a href="/admin.html" class="dropdown-item" id="adminLink" style="display:none">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span>Admin</span>
          </a>
          <a href="#" class="dropdown-item" onclick="logout();return false;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5 3H2.5a1.5 1.5 0 00-1.5 1.5v5a1.5 1.5 0 001.5 1.5H5M8.5 10.5L11.5 7.5M11.5 7.5L8.5 4.5M11.5 7.5H4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="meta.logout">Log out</span>
          </a>
        </div>
      </div>
      <a href="/login.html" class="login-btn" id="loginBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M10 3H3a2 2 0 00-2 2v4a2 2 0 002 2h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M11 7V4a1 1 0 00-2 0v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M12 11v1a1 1 0 01-1 1H3a1 1 0 01-1-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="meta.login">Log in</span>
      </a>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.home">Home</div>
      <a href="/" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2.5 8.5L8 3l5.5 5.5V14a.5.5 0 01-.5.5H2.5a.5.5 0 01-.5-.5V8.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M6 14.5V10h4v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="menu.home">Home</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="meta.categories">Categories</div>
      <a href="/category/short_drama" class="sidebar-item" data-category="short_drama">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 13v-2M10 13v-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.short_drama">Short Dramas</span>
      </a>
      <a href="/category/tv_series" class="sidebar-item" data-category="tv_series">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.tv_series">TV Series</span>
      </a>
      <a href="/category/movie" class="sidebar-item" data-category="movie">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
        <span data-i18n="menu.movie">Movies</span>
      </a>
      <a href="/category/ugc_long_video" class="sidebar-item" data-category="ugc_long_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.ugc_long_video">UGC Videos</span>
      </a>
      <a href="/category/short_video" class="sidebar-item" data-category="short_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.short_video">Short Videos</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.explorer">Explore</div>
      <a href="/shorts.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.shorts">Shorts</span>
      </a>
      <div class="sidebar-title" data-i18n="collection.myCollection">My Collection</div>
      <a href="/collection/my" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3"/><path d="M5 2V4M11 2V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="collection.myCollection">My Collection</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div id="settingsRoot">
      <!-- loading / login required placeholder, replaced by init() -->
      <div class="settings-page">
        <div class="settings-err-card">
          <p data-i18n="admin.loading">Loading...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    var currentUser = null;

    function escapeHtml(str) {
      if (!str) return '';
      var d = document.createElement('div'); d.textContent = str;
      return d.innerHTML;
    }

    function t(key, params) {
      return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : (params ? key.replace(/\{(\w+)\}/g, function(_, k) { return params[k] || ''; }) : key);
    }

    async function apiFetch(url, options) {
      options = options || {};
      var token = localStorage.getItem('zenglance_token');
      var headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
      return fetch(url, { ...options, headers });
    }

    async function loadUser() {
      var token = localStorage.getItem('zenglance_token');
      var userMenu = document.getElementById('userMenu');
      var loginBtn = document.getElementById('loginBtn');
      var uploadBtn = document.getElementById('uploadBtn');

      if (!token) {
        if (userMenu) userMenu.style.display = 'none';
        if (loginBtn) loginBtn.style.display = 'inline-flex';
        if (uploadBtn) uploadBtn.style.display = 'none';
        return null;
      }
      try {
        var res = await apiFetch('/auth/me');
        if (!res || !res.ok) {
          if (res && res.status === 401) localStorage.removeItem('zenglance_token');
          if (userMenu) userMenu.style.display = 'none';
          if (loginBtn) loginBtn.style.display = 'inline-flex';
          if (uploadBtn) uploadBtn.style.display = 'none';
          return null;
        }
        var data = await res.json();
        currentUser = data.data;
        if (!currentUser) return null;

        var avatarEl = document.getElementById('userAvatar');
        var nameEl = document.getElementById('userName');
        var profileLink = document.getElementById('profileLink');
        var adminLink = document.getElementById('adminLink');

        if (avatarEl) avatarEl.textContent = (currentUser.name || 'U').slice(0, 2).toUpperCase();
        if (nameEl) nameEl.textContent = currentUser.name;
        if (profileLink) profileLink.href = '/profile.html?id=' + currentUser.id;
        if (adminLink) adminLink.style.display = currentUser.role === 'admin' ? 'flex' : 'none';

        if (userMenu) userMenu.style.display = 'flex';
        if (loginBtn) loginBtn.style.display = 'none';
        if (uploadBtn) uploadBtn.style.display = currentUser.role !== 'free' ? 'inline-flex' : 'none';

        return currentUser;
      } catch (e) { console.error('loadUser error:', e); return null; }
    }

    // ── Navbar interactions ──────────────────────────────────────────────────
    function initNavbar() {
      document.getElementById('sidebarToggle')?.addEventListener('click', function() {
        document.body.classList.toggle('sidebar-open');
      });

      document.querySelector('.user-menu')?.addEventListener('click', function(e) {
        e.stopPropagation();
        var dd = this.querySelector('.user-dropdown');
        if (dd) dd.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.user-menu')) {
          var dd = document.querySelector('.user-dropdown');
          if (dd) dd.classList.remove('show');
        }
        if (!e.target.closest('.lang-wrapper')) {
          var ld = document.getElementById('langDropdown');
          if (ld) ld.classList.remove('show');
        }
      });

      document.getElementById('searchInput')?.addEventListener('keyup', function(e) {
        if (e.key === 'Enter' && this.value.trim()) {
          location.href = '/?q=' + encodeURIComponent(this.value.trim());
        }
      });

      document.getElementById('uploadBtn')?.addEventListener('click', function() {
        location.href = '/';
      });

      // Header language selector
      document.getElementById('langBtn')?.addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('langDropdown')?.classList.toggle('show');
      });
      document.querySelectorAll('#langDropdown .lang-option').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var lang = this.dataset.lang;
          if (window.i18n && window.i18n.setLang) window.i18n.setLang(lang);
          document.getElementById('langDropdown')?.classList.remove('show');
          renderSettings(); // re-render with new language
        });
      });
    }

    async function logout() {
      var token = localStorage.getItem('zenglance_token');
      if (token) { try { await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {} }
      localStorage.removeItem('zenglance_token');
      location.href = '/';
    }
    window.logout = logout;

    // ── Theme handling ───────────────────────────────────────────────────────
    function getStoredTheme() {
      return localStorage.getItem('zenglance_theme') || 'auto';
    }
    function applyTheme(theme) {
      var root = document.documentElement;
      root.removeAttribute('data-theme');
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else if (theme === 'light') root.setAttribute('data-theme', 'light');
      else {
        // auto: use system preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          root.setAttribute('data-theme', 'light');
        } else {
          root.setAttribute('data-theme', 'dark');
        }
      }
    }
    function setTheme(theme) {
      localStorage.setItem('zenglance_theme', theme);
      applyTheme(theme);
    }
    // Apply ASAP to avoid FOUC
    applyTheme(getStoredTheme());
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
        if (getStoredTheme() === 'auto') applyTheme('auto');
      });
    }

    // ── Settings storage getters ─────────────────────────────────────────────
    function getPref(key, def) {
      try { var v = localStorage.getItem('zenglance_pref_' + key); return v === null ? def : (v === 'true' ? true : v === 'false' ? false : v); } catch (e) { return def; }
    }
    function setPref(key, val) {
      try { localStorage.setItem('zenglance_pref_' + key, String(val)); } catch (e) {}
    }

    // ── Render settings page ─────────────────────────────────────────────────
    function formatJoined(ts) {
      if (!ts) return '';
      try {
        var d = new Date(ts);
        return d.toLocaleDateString();
      } catch (e) { return ''; }
    }

    function showLoginRequired() {
      document.getElementById('settingsRoot').innerHTML =
        '<div class="settings-page">' +
          '<div class="settings-err-card">' +
            '<p>' + t('settings.loginRequired') + '</p>' +
            '<a href="/login.html" class="settings-err-btn">' + t('settings.loginBtn') + '</a>' +
          '</div>' +
        '</div>';
    }

    function renderSettings() {
      if (!currentUser) { showLoginRequired(); return; }
      var u = currentUser;
      var roleBadgeClass = (u.role === 'admin' || u.role === 'senior' || u.role === 'free') ? u.role : 'free';
      var joinedStr = formatJoined(u.createdAt);

      // Pref defaults
      var prefEmail = getPref('notif_email', true);
      var prefPush = getPref('notif_push', true);
      var prefNewVideo = getPref('notif_newvideo', true);
      var prefPublic = getPref('privacy_public', true);
      var prefHistory = getPref('privacy_history', true);

      var currentTheme = getStoredTheme();
      var currentLang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'en';

      var html =
        '<div class="settings-page">' +
          '<a href="/" class="settings-back">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<span data-i18n="meta.back">Back</span>' +
          '</a>' +

          '<div class="settings-header">' +
            '<h1 class="settings-title" data-i18n="settings.pageTitle">Settings</h1>' +
            '<p class="settings-subtitle" data-i18n="settings.pageSubtitle">Manage your account and preferences</p>' +
          '</div>' +

          // ── Account section ─────────────────────────────────────────────
          '<section class="settings-section">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 17c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.accountTitle">Account</h2>' +
            '</div>' +

            '<div class="account-fields">' +
              '<div class="account-field">' +
                '<div class="account-field-label" data-i18n="settings.accountName">Name</div>' +
                '<div class="account-field-value readonly">' + escapeHtml(u.name || '') + '</div>' +
              '</div>' +
              '<div class="account-field">' +
                '<div class="account-field-label" data-i18n="settings.accountEmail">Email</div>' +
                '<div class="account-field-value readonly">' + escapeHtml(u.email || '') + '</div>' +
              '</div>' +
              '<div class="account-field">' +
                '<div class="account-field-label" data-i18n="settings.accountRole">Plan</div>' +
                '<div class="account-field-value"><span class="role-badge ' + roleBadgeClass + '">' + escapeHtml(roleBadgeClass) + '</span></div>' +
              '</div>' +
              '<div class="account-field">' +
                '<div class="account-field-label" data-i18n="settings.accountJoined">Joined</div>' +
                '<div class="account-field-value readonly">' + escapeHtml(joinedStr) + '</div>' +
              '</div>' +
              '<div class="account-field">' +
                '<div class="account-field-label" data-i18n="settings.accountBio">Bio</div>' +
                '<textarea id="accBio" maxlength="500" data-i18n-placeholder="settings.accountBioPh" placeholder="Tell the world about yourself...">' + escapeHtml(u.bio || '') + '</textarea>' +
              '</div>' +
            '</div>' +

            '<div class="account-actions">' +
              '<span class="account-status" id="accStatus" data-i18n="settings.saved">Saved!</span>' +
              '<button class="btn-primary" id="accSave" data-i18n="settings.accountSave">Save changes</button>' +
            '</div>' +
          '</section>' +

          // ── Appearance section ──────────────────────────────────────────
          '<section class="settings-section">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5V10l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.appearTitle">Appearance</h2>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.themeTitle">Theme</div>' +
              '</div>' +
            '</div>' +
            '<div class="theme-picker" id="themePicker">' +
              '<button class="theme-option' + (currentTheme === 'auto' ? ' active' : '') + '" data-theme="auto">' +
                '<svg class="theme-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.6"/><path d="M3 3l9 9 9-9" stroke="currentColor" stroke-width="1.4"/></svg>' +
                '<span data-i18n="settings.themeAuto">Auto (system)</span>' +
              '</button>' +
              '<button class="theme-option' + (currentTheme === 'dark' ? ' active' : '') + '" data-theme="dark">' +
                '<svg class="theme-icon" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' +
                '<span data-i18n="settings.themeDark">Dark</span>' +
              '</button>' +
              '<button class="theme-option' + (currentTheme === 'light' ? ' active' : '') + '" data-theme="light">' +
                '<svg class="theme-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
                '<span data-i18n="settings.themeLight">Light</span>' +
              '</button>' +
            '</div>' +
          '</section>' +

          // ── Language section ────────────────────────────────────────────
          '<section class="settings-section">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2v16M2 6h16M3 6c1.5-2.5 3-3 7-3s5.5.5 7 3M3 14c1.5 2.5 3 3 7 3s5.5-.5 7-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.langTitle">Language</h2>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.langTitle">Language</div>' +
                '<div class="setting-desc" data-i18n="settings.langDesc">Preferred display language for the platform</div>' +
              '</div>' +
              '<select class="settings-select" id="langSelect">' +
                '<option value="en"' + (currentLang === 'en' ? ' selected' : '') + '>English</option>' +
                '<option value="fr"' + (currentLang === 'fr' ? ' selected' : '') + '>Français</option>' +
                '<option value="de"' + (currentLang === 'de' ? ' selected' : '') + '>Deutsch</option>' +
                '<option value="it"' + (currentLang === 'it' ? ' selected' : '') + '>Italiano</option>' +
                '<option value="es"' + (currentLang === 'es' ? ' selected' : '') + '>Español</option>' +
                '<option value="ar"' + (currentLang === 'ar' ? ' selected' : '') + '>العربية</option>' +
              '</select>' +
            '</div>' +
          '</section>' +

          // ── Notifications section ───────────────────────────────────────
          '<section class="settings-section">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2a5 5 0 00-5 5v4l-2 3h14l-2-3V7a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 16a2 2 0 104 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.notifTitle">Notifications</h2>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.notifEmail">Email notifications</div>' +
              '</div>' +
              '<label class="toggle-switch">' +
                '<input type="checkbox" id="notifEmail"' + (prefEmail ? ' checked' : '') + '/>' +
                '<span class="toggle-slider"></span>' +
              '</label>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.notifPush">Push notifications</div>' +
              '</div>' +
              '<label class="toggle-switch">' +
                '<input type="checkbox" id="notifPush"' + (prefPush ? ' checked' : '') + '/>' +
                '<span class="toggle-slider"></span>' +
              '</label>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.notifNewVideo">New videos from followed users</div>' +
              '</div>' +
              '<label class="toggle-switch">' +
                '<input type="checkbox" id="notifNewVideo"' + (prefNewVideo ? ' checked' : '') + '/>' +
                '<span class="toggle-slider"></span>' +
              '</label>' +
            '</div>' +
          '</section>' +

          // ── Privacy section ─────────────────────────────────────────────
          '<section class="settings-section">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 3v5c0 4-3.2 7.5-7 8-3.8-.5-7-4-7-8V5l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.privacyTitle">Privacy</h2>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.privacyPublic">Public profile</div>' +
              '</div>' +
              '<label class="toggle-switch">' +
                '<input type="checkbox" id="privacyPublic"' + (prefPublic ? ' checked' : '') + '/>' +
                '<span class="toggle-slider"></span>' +
              '</label>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.privacyHistory">Save watch history</div>' +
              '</div>' +
              '<label class="toggle-switch">' +
                '<input type="checkbox" id="privacyHistory"' + (prefHistory ? ' checked' : '') + '/>' +
                '<span class="toggle-slider"></span>' +
              '</label>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.privacyClearHistory">Clear watch history</div>' +
              '</div>' +
              '<button class="settings-link" id="clearHistoryBtn" data-i18n="settings.privacyClearHistory">Clear watch history</button>' +
            '</div>' +

            '<div class="setting-row">' +
              '<div class="setting-info">' +
                '<div class="setting-label" data-i18n="settings.privacyLegal">Legal</div>' +
                '<div class="setting-desc">' +
                  '<a href="/privacy.html" class="settings-link" style="margin-right:1rem" data-i18n="settings.privacyPolicy">Privacy Policy</a>' +
                  '<a href="/terms.html" class="settings-link" style="margin-right:1rem" data-i18n="settings.privacyTerms">Terms of Service</a>' +
                  '<a href="/cookie.html" class="settings-link" data-i18n="settings.privacyCookie">Cookie Policy</a>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>' +

          // ── Danger zone ─────────────────────────────────────────────────
          '<section class="settings-section danger">' +
            '<div class="settings-section-header">' +
              '<div class="settings-section-icon">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L2 17h16L10 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<h2 class="settings-section-title" data-i18n="settings.dangerTitle">Danger Zone</h2>' +
            '</div>' +

            '<div class="danger-row">' +
              '<div class="danger-info">' +
                '<div class="danger-label" data-i18n="settings.dangerLogout">Log out from all devices</div>' +
              '</div>' +
              '<button class="btn-danger" id="logoutAllBtn" data-i18n="settings.dangerLogoutBtn">Log out everywhere</button>' +
            '</div>' +

            '<div class="danger-row">' +
              '<div class="danger-info">' +
                '<div class="danger-label" data-i18n="settings.dangerDelete">Delete account</div>' +
              '</div>' +
              '<button class="btn-danger" id="deleteAccountBtn" data-i18n="settings.dangerDeleteBtn">Delete my account</button>' +
            '</div>' +
          '</section>' +
        '</div>';

      document.getElementById('settingsRoot').innerHTML = html;

      // Re-apply i18n to newly injected nodes
      if (window.i18n && window.i18n.apply) window.i18n.apply();

      bindSettingsEvents();
    }

    // ── Bind settings interactions ───────────────────────────────────────────
    function bindSettingsEvents() {
      // Account save
      var accSave = document.getElementById('accSave');
      var accStatus = document.getElementById('accStatus');
      if (accSave) {
        accSave.addEventListener('click', async function() {
          var bio = document.getElementById('accBio').value;
          try {
            var res = await apiFetch('/auth/me', { method: 'PATCH', body: JSON.stringify({ bio: bio }) });
            if (!res.ok) throw new Error('fail');
            var data = await res.json();
            if (data.data && currentUser) currentUser.bio = data.data.bio;
            if (accStatus) {
              accStatus.textContent = t('settings.accountSaved');
              accStatus.classList.add('show');
              setTimeout(function() { accStatus.classList.remove('show'); }, 2000);
            }
          } catch (e) {
            if (accStatus) {
              accStatus.textContent = t('settings.saveError');
              accStatus.classList.add('show');
              accStatus.style.color = '#ff6b6b';
              setTimeout(function() { accStatus.classList.remove('show'); accStatus.style.color = ''; }, 2500);
            }
          }
        });
      }

      // Theme picker
      document.querySelectorAll('#themePicker .theme-option').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var theme = this.dataset.theme;
          setTheme(theme);
          document.querySelectorAll('#themePicker .theme-option').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
        });
      });

      // Language select (settings section)
      var langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.addEventListener('change', function() {
          var lang = this.value;
          if (window.i18n && window.i18n.setLang) window.i18n.setLang(lang);
          renderSettings();
        });
      }

      // Notification toggles
      function bindToggle(id, key) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', function() { setPref(key, el.checked); });
      }
      bindToggle('notifEmail', 'notif_email');
      bindToggle('notifPush', 'notif_push');
      bindToggle('notifNewVideo', 'notif_newvideo');
      bindToggle('privacyPublic', 'privacy_public');
      bindToggle('privacyHistory', 'privacy_history');

      // Clear history
      var clearBtn = document.getElementById('clearHistoryBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', async function() {
          if (!confirm(t('settings.privacyClearHistory') + '?')) return;
          try { await apiFetch('/api/interaction/history', { method: 'DELETE' }); } catch (e) {}
        });
      }

      // Log out all devices
      var logoutAllBtn = document.getElementById('logoutAllBtn');
      if (logoutAllBtn) {
        logoutAllBtn.addEventListener('click', async function() {
          if (!confirm(t('settings.dangerLogout') + '?')) return;
          var token = localStorage.getItem('zenglance_token');
          try { if (token) await fetch('/auth/logout/all', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {}
          localStorage.removeItem('zenglance_token');
          location.href = '/login.html';
        });
      }

      // Delete account
      var delBtn = document.getElementById('deleteAccountBtn');
      if (delBtn) {
        delBtn.addEventListener('click', async function() {
          if (!confirm(t('settings.dangerDelete') + '? ' + (window.i18n ? t('profile.loginRequired') : '') + ' IRREVERSIBLE.')) return;
          if (!confirm('Really delete your account? There is no going back.')) return;
          try {
            var res = await apiFetch('/auth/me', { method: 'DELETE' });
            if (res.ok || res.status === 401) {
              localStorage.removeItem('zenglance_token');
              location.href = '/';
            }
          } catch (e) {}
        });
      }
    }

    function init() {
      if (window.i18n) window.i18n.init();
      initNavbar();
      loadUser().then(function(user) {
        if (!user) { showLoginRequired(); return; }
        renderSettings();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>

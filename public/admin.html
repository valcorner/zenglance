<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ZenGlance</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="i18n.js?v=12"></script>
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem; }

    .admin-search { margin-bottom: 1rem; }
    .admin-search input {
      width: 100%; max-width: 400px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-input); color: var(--text-primary); font-size: 14px;
    }
    .admin-search input:focus { outline: none; border-color: var(--accent); }

    .admin-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); }
    .admin-table th { background: var(--bg-nav); color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; white-space: nowrap; }
    .admin-table td { padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); vertical-align: middle; font-size: 14px; }
    .admin-table tr:hover td { background: var(--bg-hover); }
    .admin-table tr.hidden { display: none; }

    .admin-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; overflow: hidden; }
    .admin-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .admin-user-name { font-weight: 600; }
    .admin-user-email { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .admin-role-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .admin-role-badge.admin { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .admin-role-badge.senior { background: rgba(123,47,255,0.2); color: #b388ff; }
    .admin-role-badge.free { background: rgba(100,200,100,0.2); color: #6fcf6f; }

    .admin-role-select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 12px; cursor: pointer; }
    .admin-role-select:focus { outline: none; border-color: var(--accent); }

    .admin-save-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-left: 6px; transition: background 0.2s, color 0.2s; }
    .admin-save-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .admin-pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
    .admin-page-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .admin-page-btn:hover { background: var(--bg-hover); }
    .admin-page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .admin-page-info { font-size: 13px; color: var(--text-muted); }

    .admin-loading, .admin-empty, .admin-error { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .admin-error { color: #ff6b6b; }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/" class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 9l8 5-8 5V9z" fill="currentColor"/>
      </svg>
      <span class="logo-text">ZenGlance</span>
    </a>
    <div class="header-right" id="headerRight"></div>
  </header>

  <div class="admin-page">
    <h1 data-i18n="admin.title">Admin — User Management</h1>
    <div class="admin-search">
      <input type="text" id="adminSearch" data-i18n-placeholder="meta.search" placeholder="Search users…" oninput="filterUsers()" />
    </div>
    <div id="adminContent">
      <div class="admin-loading" data-i18n="admin.loading">Loading…</div>
    </div>
  </div>

  <script>
    var ADMIN_TOKEN = localStorage.getItem('zenglance_token');
    var rawUsers = [];
    var currentPage = 1;
    var totalUsers = 0;

    function escapeHtml(s) {
      if (!s) return '';
      var d = document.createElement('div'); d.textContent = s;
      return d.innerHTML;
    }

    function t(key, params) {
      return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : (params ? key.replace(/\{(\w+)\}/g, function(_, k) { return params[k] || ''; }) : key);
    }

    function renderAvatar(user, size) {
      var initial = (user.name || user.email || '?').charAt(0).toUpperCase();
      if (user.avatar) {
        return '<div class="admin-avatar" style="width:' + size + 'px;height:' + size + 'px"><img src="' + escapeHtml(user.avatar) + '" alt=""></div>';
      }
      return '<div class="admin-avatar" style="width:' + size + 'px;height:' + size + 'px">' + initial + '</div>';
    }

    function roleBadge(role) {
      return '<span class="admin-role-badge ' + role + '">' + role + '</span>';
    }

    function formatDatetime(ts) {
      return new Date(ts).toLocaleString();
    }

    function renderAdminTable(users, page, limit, total) {
      totalUsers = total;
      var totalPages = Math.max(1, Math.ceil(total / limit));
      currentPage = page;

      var rows = users.map(function(u) {
        return '<tr data-id="' + escapeHtml(u.id) + '">' +
          '<td>' + renderAvatar(u, 36) + '</td>' +
          '<td><div class="admin-user-name">' + escapeHtml(u.name || '—') + '</div>' +
               '<div class="admin-user-email">' + escapeHtml(u.email) + '</div></td>' +
          '<td>' + roleBadge(u.role) + '</td>' +
          '<td>' + formatDatetime(u.createdAt) + '</td>' +
          '<td>' + formatDatetime(u.updatedAt) + '</td>' +
          '<td>' +
            '<select class="admin-role-select" data-user-id="' + escapeHtml(u.id) + '">' +
              '<option value="free"'  + (u.role === 'free'  ? ' selected' : '') + '>free</option>' +
              '<option value="senior"' + (u.role === 'senior' ? ' selected' : '') + '>senior</option>' +
              '<option value="admin"'  + (u.role === 'admin'  ? ' selected' : '') + '>admin</option>' +
            '</select>' +
            '<button class="admin-save-btn" onclick="saveRole(\'' + escapeHtml(u.id) + '\')">' + t('admin.save') + '</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      var pagination = '<div class="admin-pagination">' +
        '<button class="admin-page-btn" onclick="goPage(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>' + t('meta.prev') + '</button>' +
        '<span class="admin-page-info">' + t('admin.paginationInfo', { page: page, total: totalPages, count: total }) + '</span>' +
        '<button class="admin-page-btn" onclick="goPage(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>' + t('meta.next') + '</button>' +
      '</div>';

      rawUsers = users;
      document.getElementById('adminContent').innerHTML =
        '<table class="admin-table"><thead><tr>' +
          '<th></th><th>' + t('admin.colUser') + '</th><th>' + t('admin.colRole') + '</th><th>' + t('admin.colJoined') + '</th><th>' + t('admin.colUpdated') + '</th><th>' + t('admin.colChangeRole') + '</th>' +
        '</tr></thead><tbody id="adminTableBody">' + rows + '</tbody></table>' + pagination;

      document.querySelectorAll('.admin-role-select').forEach(function(sel) {
        sel.addEventListener('change', function() { this.querySelector('.admin-save-btn').click(); });
      });
    }

    function filterUsers() {
      var q = document.getElementById('adminSearch').value.toLowerCase();
      var rows = document.querySelectorAll('#adminTableBody tr');
      rows.forEach(function(row) {
        var text = row.textContent.toLowerCase();
        row.classList.toggle('hidden', q && !text.includes(q));
      });
    }

    async function loadUsers(page) {
      page = page || 1;
      document.getElementById('adminContent').innerHTML = '<div class="admin-loading">' + t('admin.loading') + '</div>';
      try {
        var res = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN } });
        if (!res.ok) { localStorage.removeItem('zenglance_token'); location.href = '/login.html'; return; }
        var me = await res.json();
        if (me.data.role !== 'admin') { location.href = '/'; return; }

        var r = await fetch('/api/admin/users?page=' + page + '&limit=20', {
          headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN }
        });
        if (!r.ok) { document.getElementById('adminContent').innerHTML = '<div class="admin-error">' + t('admin.error') + '</div>'; return; }
        var data = await r.json();
        renderAdminTable(data.data, data.page, data.limit, data.total);
        if (document.getElementById('adminSearch')) document.getElementById('adminSearch').value = '';
      } catch (e) {
        document.getElementById('adminContent').innerHTML = '<div class="admin-error">' + escapeHtml(e.message) + '</div>';
      }
    }

    window.goPage = function(page) { loadUsers(page); };
    window.saveRole = async function(userId) {
      var sel = document.querySelector('.admin-role-select[data-user-id="' + userId + '"]');
      if (!sel) return;
      var role = sel.value;
      var btn = sel.closest('td').querySelector('.admin-save-btn');
      btn.textContent = t('admin.saving'); btn.disabled = true;
      try {
        var r = await fetch('/api/admin/users/' + userId + '/role', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: role })
        });
        var json = await r.json().catch(function() { return null; });
        if (!r.ok || !json || !json.success) throw new Error(json && json.error ? json.error : 'Failed');
        btn.textContent = t('admin.saved');
        setTimeout(function() { btn.textContent = t('admin.save'); btn.disabled = false; }, 1500);
      } catch (e) {
        btn.textContent = t('admin.save'); btn.disabled = false;
        alert(t('admin.roleSaveFailed', { error: e.message || '' }));
      }
    };

    async function loadUser() {
      var token = localStorage.getItem('zenglance_token');
      var headerRight = document.getElementById('headerRight');
      if (!token) {
        headerRight.innerHTML = '<a href="/login.html" class="login-btn">' + t('meta.login') + '</a>';
        return null;
      }
      try {
        var res = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) { localStorage.removeItem('zenglance_token'); return null; }
        var data = await res.json();
        headerRight.innerHTML =
          '<div class="user-menu" style="position:relative">' +
            '<button class="user-menu-btn" onclick="toggleMenu(event)">' +
              '<div class="user-avatar" style="background:var(--accent);color:#fff;font-size:12px;font-weight:700;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + (data.user.name || 'U').charAt(0).toUpperCase() + '</div>' +
              '<span class="user-name">' + escapeHtml(data.user.name) + '</span>' +
              '<svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 8L2 4h8z"/></svg>' +
            '</button>' +
            '<div class="user-dropdown" id="userDropdown" style="display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);min-width:160px;z-index:100;overflow:hidden;">' +
              '<a href="/profile.html" class="dropdown-item">' + t('meta.profile') + '</a>' +
              '<div class="dropdown-divider"></div>' +
              '<a href="#" class="dropdown-item" onclick="logout();return false;">' + t('meta.logout') + '</a>' +
            '</div>' +
          '</div>';
        return data.user;
      } catch (e) { return null; }
    }

    function toggleMenu(e) {
      e.stopPropagation();
      var dd = document.getElementById('userDropdown');
      dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function() {
      var dd = document.getElementById('userDropdown');
      if (dd) dd.style.display = 'none';
    });

    async function logout() {
      var token = localStorage.getItem('zenglance_token');
      if (token) { try { await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {} }
      localStorage.removeItem('zenglance_token');
      location.href = '/';
    }
    window.logout = logout;

    loadUser().then(function(user) {
      if (!user || user.role !== 'admin') {
        document.getElementById('adminContent').innerHTML =
          '<div class="admin-error" style="padding-top:2rem">' + t('admin.accessDenied') + '</div>';
        return;
      }
      loadUsers(1);
    });

    if (window.i18n && window.i18n.onLangChange) {
      window.i18n.onLangChange(function() {
        if (rawUsers.length) renderAdminTable(rawUsers, currentPage, 20, totalUsers);
      });
    }
  </script>
</body>
</html>

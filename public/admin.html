<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ZenGlance</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="i18n.js?v=12"></script>
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem; }

    .admin-search { margin-bottom: 1rem; }
    .admin-search input {
      width: 100%; max-width: 400px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-input); color: var(--text-primary); font-size: 14px;
    }
    .admin-search input:focus { outline: none; border-color: var(--accent); }

    .admin-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); }
    .admin-table th { background: var(--bg-nav); color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; white-space: nowrap; }
    .admin-table td { padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); vertical-align: middle; font-size: 14px; }
    .admin-table tr:hover td { background: var(--bg-hover); }
    .admin-table tr.hidden { display: none; }

    .admin-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; overflow: hidden; }
    .admin-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .admin-user-name { font-weight: 600; }
    .admin-user-email { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .admin-role-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .admin-role-badge.admin { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .admin-role-badge.senior { background: rgba(123,47,255,0.2); color: #b388ff; }
    .admin-role-badge.free { background: rgba(100,200,100,0.2); color: #6fcf6f; }

    .admin-role-select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 12px; cursor: pointer; }
    .admin-role-select:focus { outline: none; border-color: var(--accent); }

    .admin-save-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-left: 6px; transition: background 0.2s, color 0.2s; }
    .admin-save-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .admin-pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
    .admin-page-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .admin-page-btn:hover { background: var(--bg-hover); }
    .admin-page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .admin-page-info { font-size: 13px; color: var(--text-muted); }

    .admin-loading, .admin-empty, .admin-error { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .admin-error { color: #ff6b6b; }
    .admin-error-card {
      text-align: center; padding: 3rem 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); max-width: 400px; margin: 2rem auto;
    }
    .admin-error-card p { font-size: 15px; color: var(--text-secondary); margin-bottom: 1.25rem; line-height: 1.6; }
    .admin-error-card .admin-error-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; border-radius: 20px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: opacity 0.2s;
    }
    .admin-error-card .admin-error-btn:hover { opacity: 0.85; }

    /* ── Language selector (same as index.html) ──────────────────────────── */
    .lang-wrapper { position: relative; display: inline-block; }
    .lang-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: var(--text-primary);
      font-size: 13px; cursor: pointer; line-height: 1;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.14); }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface-2); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 6px; min-width: 150px;
      z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lang-dropdown.show { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 12px; border: none; background: none;
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      border-radius: 6px; text-align: left;
      transition: background 0.1s, color 0.1s;
    }
    .lang-option:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .lang-option.active { color: var(--accent); font-weight: 600; }
    html[dir="rtl"] .lang-dropdown { right: auto; left: 0; }
    html[dir="rtl"] .sidebar { transform: none; }
    html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(8rem); }
    html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 16rem; }
    html[dir="rtl"] .mobile-sidebar-toggle { left: 0.75rem; right: auto; }
    html[dir="rtl"] .dropdown-arrow { transform: rotate(180deg); }
    html[dir="rtl"] .dropdown-arrow.show { transform: rotate(0deg); }
    @media (max-width: 768px) {
      html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(-8rem); }
      html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="mobile-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text" data-i18n="meta.title">ZenGlance</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="meta.search" placeholder="Search content..." />
      </div>
    </div>

    <div class="header-right">
      <div class="lang-wrapper">
        <button class="lang-btn" id="langBtn" aria-label="Change language">
          <span>EN</span>
          <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
          <button class="lang-option" data-lang="fr" data-lang-label="Français"><span>FR</span> Français</button>
          <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
          <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
          <button class="lang-option" data-lang="es" data-lang-label="Español"><span>ES</span> Español</button>
          <button class="lang-option" data-lang="ar" data-lang-label="العربية"><span>SA</span> العربية</button>
        </div>
      </div>

      <button class="upload-btn" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v8M3.5 5.5L7 2l3.5 3.5M2 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meta.upload">Upload</span>
      </button>

      <div class="user-menu" id="userMenu" style="display:none">
        <div class="user-avatar" id="userAvatar">U</div>
        <span class="user-name" id="userName">User</span>
        <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="user-dropdown" id="userDropdown">
          <a href="#" class="dropdown-item" id="profileLink">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1.5 12.5c0-2.5 2-4.5 5.5-4.5s5.5 2 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span data-i18n="meta.profile">Profile</span>
          </a>
          <a href="/admin.html" class="dropdown-item" id="adminLink" style="display:none">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span>Admin</span>
          </a>
          <a href="#" class="dropdown-item" id="logoutBtn" onclick="logout();return false;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5 3H2.5a1.5 1.5 0 00-1.5 1.5v5a1.5 1.5 0 001.5 1.5H5M8.5 10.5L11.5 7.5M11.5 7.5L8.5 4.5M11.5 7.5H4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="meta.logout">Log out</span>
          </a>
        </div>
      </div>
      <a href="/login.html" class="login-btn" id="loginBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M10 3H3a2 2 0 00-2 2v4a2 2 0 002 2h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M11 7V4a1 1 0 00-2 0v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M12 11v1a1 1 0 01-1 1H3a1 1 0 01-1-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="meta.login">Log in</span>
      </a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.home">Home</div>
      <a href="/" class="sidebar-item active">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2.5 8.5L8 3l5.5 5.5V14a.5.5 0 01-.5.5H2.5a.5.5 0 01-.5-.5V8.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M6 14.5V10h4v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="menu.home">Home</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="meta.categories">Categories</div>
      <a href="/" class="sidebar-item" data-category="short_drama">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 13v-2M10 13v-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.short_drama">Short Dramas</span>
      </a>
      <a href="/" class="sidebar-item" data-category="tv_series">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.tv_series">TV Series</span>
      </a>
      <a href="/" class="sidebar-item" data-category="movie">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
        <span data-i18n="menu.movie">Movies</span>
      </a>
      <a href="/" class="sidebar-item" data-category="ugc_long_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.ugc_long_video">UGC Videos</span>
      </a>
      <a href="/" class="sidebar-item" data-category="short_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.short_video">Short Videos</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.explorer">Explore</div>
      <a href="/shorts.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.shorts">Shorts</span>
      </a>
      <div class="sidebar-title" data-i18n="collection.myCollection">My Collection</div>
      <a href="/collection.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3"/><path d="M5 2V4M11 2V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="collection.myCollection">My Collection</span>
      </a>
    </div>
  </nav>

  <main class="main">
    <div class="admin-page">
      <h1 data-i18n="admin.title">Admin — User Management</h1>
      <div class="admin-search">
        <input type="text" id="adminSearch" data-i18n-placeholder="meta.search" placeholder="Search users…" oninput="filterUsers()" />
      </div>
      <div id="adminContent">
        <div class="admin-loading" data-i18n="admin.loading">Loading…</div>
      </div>
    </div>
  </main>

  <script>
    var ADMIN_TOKEN = localStorage.getItem('zenglance_token');
    var rawUsers = [];
    var currentPage = 1;
    var totalUsers = 0;

    function escapeHtml(s) {
      if (!s) return '';
      var d = document.createElement('div'); d.textContent = s;
      return d.innerHTML;
    }

    function t(key, params) {
      return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : (params ? key.replace(/\{(\w+)\}/g, function(_, k) { return params[k] || ''; }) : key);
    }

    function renderAvatar(user, size) {
      var initial = (user.name || user.email || '?').charAt(0).toUpperCase();
      if (user.avatar) {
        return '<div class="admin-avatar" style="width:' + size + 'px;height:' + size + 'px"><img src="' + escapeHtml(user.avatar) + '" alt=""></div>';
      }
      return '<div class="admin-avatar" style="width:' + size + 'px;height:' + size + 'px">' + initial + '</div>';
    }

    function roleBadge(role) {
      return '<span class="admin-role-badge ' + role + '">' + role + '</span>';
    }

    function formatDatetime(ts) {
      return new Date(ts).toLocaleString();
    }

    function renderAdminTable(users, page, limit, total) {
      totalUsers = total;
      var totalPages = Math.max(1, Math.ceil(total / limit));
      currentPage = page;

      var rows = users.map(function(u) {
        return '<tr data-id="' + escapeHtml(u.id) + '">' +
          '<td>' + renderAvatar(u, 36) + '</td>' +
          '<td><div class="admin-user-name">' + escapeHtml(u.name || '—') + '</div>' +
               '<div class="admin-user-email">' + escapeHtml(u.email) + '</div></td>' +
          '<td>' + roleBadge(u.role) + '</td>' +
          '<td>' + formatDatetime(u.createdAt) + '</td>' +
          '<td>' + formatDatetime(u.updatedAt) + '</td>' +
          '<td>' +
            '<select class="admin-role-select" data-user-id="' + escapeHtml(u.id) + '">' +
              '<option value="free"'  + (u.role === 'free'  ? ' selected' : '') + '>free</option>' +
              '<option value="senior"' + (u.role === 'senior' ? ' selected' : '') + '>senior</option>' +
              '<option value="admin"'  + (u.role === 'admin'  ? ' selected' : '') + '>admin</option>' +
            '</select>' +
            '<button class="admin-save-btn" onclick="saveRole(\'' + escapeHtml(u.id) + '\')">' + t('admin.save') + '</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      var pagination = '<div class="admin-pagination">' +
        '<button class="admin-page-btn" onclick="goPage(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>' + t('meta.prev') + '</button>' +
        '<span class="admin-page-info">' + t('admin.paginationInfo', { page: page, total: totalPages, count: total }) + '</span>' +
        '<button class="admin-page-btn" onclick="goPage(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>' + t('meta.next') + '</button>' +
      '</div>';

      rawUsers = users;
      document.getElementById('adminContent').innerHTML =
        '<table class="admin-table"><thead><tr>' +
          '<th></th><th>' + t('admin.colUser') + '</th><th>' + t('admin.colRole') + '</th><th>' + t('admin.colJoined') + '</th><th>' + t('admin.colUpdated') + '</th><th>' + t('admin.colChangeRole') + '</th>' +
        '</tr></thead><tbody id="adminTableBody">' + rows + '</tbody></table>' + pagination;

      document.querySelectorAll('.admin-role-select').forEach(function(sel) {
        sel.addEventListener('change', function() {
          var btn = sel.closest('td').querySelector('.admin-save-btn');
          if (btn) btn.click();
        });
      });
    }

    function filterUsers() {
      var q = document.getElementById('adminSearch').value.toLowerCase();
      var rows = document.querySelectorAll('#adminTableBody tr');
      rows.forEach(function(row) {
        var text = row.textContent.toLowerCase();
        row.classList.toggle('hidden', q && !text.includes(q));
      });
    }

    async function loadUsers(page) {
      page = page || 1;
      document.getElementById('adminContent').innerHTML = '<div class="admin-loading">' + t('admin.loading') + '</div>';
      try {
        var r = await fetch('/api/admin/users?page=' + page + '&limit=20', {
          headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN }
        });
        if (!r.ok) {
          var errText = await r.text().catch(function() { return ''; });
          document.getElementById('adminContent').innerHTML =
            '<div class="admin-error-card"><p>' + escapeHtml(r.status + ' ' + (errText || t('admin.error'))) + '</p>' +
            '<a href="/" class="admin-error-btn">' + t('meta.back') + '</a></div>';
          return;
        }
        var data = await r.json();
        renderAdminTable(data.data, data.page, data.limit, data.total);
      } catch (e) {
        document.getElementById('adminContent').innerHTML = '<div class="admin-error">' + escapeHtml(e.message) + '</div>';
      }
    }

    window.goPage = function(page) { loadUsers(page); };

    window.saveRole = async function(userId) {
      var sel = document.querySelector('.admin-role-select[data-user-id="' + userId + '"]');
      if (!sel) return;
      var role = sel.value;
      var btn = sel.closest('td').querySelector('.admin-save-btn');
      btn.textContent = t('admin.saving'); btn.disabled = true;
      try {
        var r = await fetch('/api/admin/users/' + userId + '/role', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: role })
        });
        var json = await r.json().catch(function() { return null; });
        if (!r.ok || !json || !json.success) throw new Error(json && json.error ? json.error : 'Failed');
        btn.textContent = t('admin.saved');
        setTimeout(function() { btn.textContent = t('admin.save'); btn.disabled = false; }, 1500);
      } catch (e) {
        btn.textContent = t('admin.save'); btn.disabled = false;
        alert(t('admin.roleSaveFailed', { error: e.message || '' }));
      }
    };

    async function loadUser() {
      var token = localStorage.getItem('zenglance_token');
      ADMIN_TOKEN = token;
      var userMenu = document.getElementById('userMenu');
      var loginBtn = document.getElementById('loginBtn');
      var uploadBtn = document.getElementById('uploadBtn');

      if (!token) {
        if (userMenu) userMenu.style.display = 'none';
        if (loginBtn) loginBtn.style.display = 'inline-flex';
        if (uploadBtn) uploadBtn.style.display = 'none';
        return null;
      }
      try {
        var res = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) {
          if (res.status === 401) localStorage.removeItem('zenglance_token');
          if (userMenu) userMenu.style.display = 'none';
          if (loginBtn) loginBtn.style.display = 'inline-flex';
          if (uploadBtn) uploadBtn.style.display = 'none';
          return null;
        }
        var data = await res.json();
        var user = data.data;
        if (!user) return null;

        var avatarEl = document.getElementById('userAvatar');
        var nameEl = document.getElementById('userName');
        var profileLink = document.getElementById('profileLink');
        var adminLink = document.getElementById('adminLink');

        if (avatarEl) avatarEl.textContent = (user.name || 'U').slice(0, 2).toUpperCase();
        if (nameEl) nameEl.textContent = user.name;
        if (profileLink) profileLink.href = '/profile.html?id=' + user.id;
        if (adminLink) adminLink.style.display = user.role === 'admin' ? 'flex' : 'none';

        if (userMenu) userMenu.style.display = 'flex';
        if (loginBtn) loginBtn.style.display = 'none';
        if (uploadBtn) uploadBtn.style.display = user.role !== 'free' ? 'inline-flex' : 'none';

        return user;
      } catch (e) { return null; }
    }

    // ── Navbar interactions (same as index.html) ────────────────────────────
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
      document.body.classList.toggle('sidebar-open');
    });

    document.querySelector('.user-menu')?.addEventListener('click', function() {
      var dd = this.querySelector('.user-dropdown');
      if (dd) dd.classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.user-menu')) {
        var dd = document.querySelector('.user-dropdown');
        if (dd) dd.classList.remove('show');
      }
    });

    document.getElementById('searchInput')?.addEventListener('keyup', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        location.href = '/?q=' + encodeURIComponent(this.value.trim());
      }
    });

    document.getElementById('uploadBtn')?.addEventListener('click', function() {
      location.href = '/';
    });

    async function logout() {
      var token = localStorage.getItem('zenglance_token');
      if (token) { try { await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {} }
      localStorage.removeItem('zenglance_token');
      location.href = '/';
    }
    window.logout = logout;

    loadUser().then(function(user) {
      if (!user) {
        document.getElementById('adminContent').innerHTML =
          '<div class="admin-error-card"><p>' + t('profile.loginRequired') + '</p>' +
          '<a href="/login.html" class="admin-error-btn">' + t('meta.login') + '</a></div>';
        return;
      }
      if (user.role !== 'admin') {
        document.getElementById('adminContent').innerHTML =
          '<div class="admin-error-card"><p>' + t('admin.accessDenied') + '</p>' +
          '<a href="/" class="admin-error-btn">' + t('meta.back') + '</a></div>';
        return;
      }
      loadUsers(1);
    });

    if (window.i18n && window.i18n.onLangChange) {
      window.i18n.onLangChange(function() {
        if (rawUsers.length) renderAdminTable(rawUsers, currentPage, 20, totalUsers);
      });
    }
  </script>
</body>
</html>

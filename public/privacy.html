<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Video</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <script src="i18n.js?v=14"></script>
  <style>
    .lang-wrapper { position: relative; display: inline-block; }
    .lang-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: var(--text-primary);
      font-size: 13px; cursor: pointer; line-height: 1;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.14); }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface-2); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 6px; min-width: 150px;
      z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lang-dropdown.show { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 12px; border: none; background: none;
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      border-radius: 6px; text-align: left;
      transition: background 0.1s, color 0.1s;
    }
    .lang-option:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .lang-option.active { color: var(--accent); font-weight: 600; }
    html[dir="rtl"] .lang-dropdown { right: auto; left: 0; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text" data-i18n="meta.title">Video</span>
      </a>
    </div>
    <div class="header-right">
      <div class="lang-wrapper">
        <button class="lang-btn" id="langBtn" aria-label="Change language">
          <span>EN</span>
          <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
          <button class="lang-option" data-lang="fr" data-lang-label="Français"><span>FR</span> Français</button>
          <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
          <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
          <button class="lang-option" data-lang="es" data-lang-label="Español"><span>ES</span> Español</button>
          <button class="lang-option" data-lang="ar" data-lang-label="العربية"><span>SA</span> العربية</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="legal-page">
      <a href="/" class="legal-back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="legal.backHome">Back to Home</span>
      </a>

      <h1 class="legal-title" data-i18n="legal.privacyTitle">Privacy Policy</h1>
      <div class="legal-updated" id="updatedLabel"></div>

      <div class="legal-intro" data-i18n="legal.privacyIntro"></div>

      <div class="legal-section">
        <h2 data-i18n="legal.privacyS1Title"></h2>
        <p data-i18n="legal.privacyS1Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS2Title"></h2>
        <p data-i18n="legal.privacyS2Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS3Title"></h2>
        <p data-i18n="legal.privacyS3Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS4Title"></h2>
        <p data-i18n="legal.privacyS4Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS5Title"></h2>
        <p data-i18n="legal.privacyS5Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS6Title"></h2>
        <p data-i18n="legal.privacyS6Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS7Title"></h2>
        <p data-i18n="legal.privacyS7Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS8Title"></h2>
        <p data-i18n="legal.privacyS8Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS9Title"></h2>
        <p data-i18n="legal.privacyS9Body"></p>
      </div>
      <div class="legal-section">
        <h2 data-i18n="legal.privacyS10Title"></h2>
        <p data-i18n="legal.privacyS10Body"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span class="footer-copy">© 2026 Video.</span>
    <span data-i18n="legal.footerRights">All rights reserved.</span>
    <span class="footer-sep">·</span>
    <a href="/privacy.html" data-i18n="legal.footerPrivacy">Privacy Policy</a>
    <span class="footer-sep">·</span>
    <a href="/terms.html" data-i18n="legal.footerTerms">Terms of Service</a>
    <span class="footer-sep">·</span>
    <a href="/cookie.html" data-i18n="legal.footerCookie">Cookie Policy</a>
  </footer>

  <script>
    function t(key, params) {
      return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : key;
    }
    function updateUpdated() {
      var el = document.getElementById('updatedLabel');
      if (el) el.textContent = t('legal.updatedLabel', { date: '2026-08-11' });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        if (window.i18n) window.i18n.init();
        updateUpdated();
      });
    } else {
      if (window.i18n) window.i18n.init();
      updateUpdated();
    }
    if (window.i18n && window.i18n.onLangChange) {
      window.i18n.onLangChange(updateUpdated);
    }
  </script>
</body>
</html>

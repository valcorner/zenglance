<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging in...</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0d0d0d; color: #eee; font-family: system-ui, sans-serif; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #888; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin-top: 16px; color: #888; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <p id="status">Signing in…</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');

      // Case 1: token already present → store and go home
      if (token) {
        localStorage.setItem('video_token', token);
        history.replaceState(null, '', '/');
        location.href = '/';
        return;
      }

      // Case 2: OAuth error from provider
      if (params.get('error')) {
        document.getElementById('status').textContent = 'Login failed. Please try again.';
        return;
      }

      // Case 3: Valcorner redirected back with code+state → exchange for session token
      const code = params.get('code');
      const state = params.get('state');
      if (code || state) {
        const callbackUrl = new URL('/auth/callback', location.origin);
        if (code) callbackUrl.searchParams.set('code', code);
        if (state) callbackUrl.searchParams.set('state', state);
        fetch(callbackUrl.toString())
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.token) {
              localStorage.setItem('video_token', data.token);
              location.href = '/';
            } else if (data.error) {
              document.getElementById('status').textContent = 'Login failed: ' + (data.details || data.error);
            }
          })
          .catch(function () {
            document.getElementById('status').textContent = 'Network error. Please try again.';
          });
        return;
      }

      // Case 4: first visit → start OAuth flow
      fetch('/auth/authorize')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.url) {
            location.href = data.url;
          } else {
            document.getElementById('status').textContent = 'Login failed: ' + (data.details || data.error || 'OAuth not configured');
          }
        })
        .catch(function () {
          document.getElementById('status').textContent = 'Network error. Please try again.';
        });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenGlance - 多模态内容平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f9f9f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f2f2f2;
            --bg-hover: #e5e5e5;
            --text-primary: #0f0f0f;
            --text-secondary: #606060;
            --text-muted: #909090;
            --accent: #065fd4;
            --accent-hover: #054db0;
            --border: #e0e0e0;
            --shadow: rgba(0,0,0,0.1);
            --success: #2e7d32;
            --success-bg: #e8f5e9;
            --error: #c62828;
            --error-bg: #ffebee;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 50%;
            --header-height: 56px;
            --sidebar-width: 240px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #272727;
            --bg-hover: #3a3a3a;
            --text-primary: #f1f1f1;
            --text-secondary: #aaa;
            --text-muted: #777;
            --accent: #3ea6ff;
            --accent-hover: #65b8ff;
            --border: #333;
            --shadow: rgba(0,0,0,0.4);
            --success-bg: #1b3a1b;
            --error-bg: #3a1b1b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
        }

        /* ── Header ── */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-height);
            background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000;
            box-shadow: 0 1px 8px var(--shadow);
        }

        .header-left { display: flex; align-items: center; gap: 8px; }

        .icon-btn {
            width: 40px; height: 40px; border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; background: transparent;
            color: var(--text-primary); transition: background var(--transition);
        }
        .icon-btn:hover { background: var(--bg-tertiary); }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .logo {
            display: flex; align-items: center; gap: 4px;
            font-size: 20px; font-weight: 700; color: var(--accent);
            text-decoration: none; padding: 4px 8px; border-radius: var(--radius-sm);
        }
        .logo:hover { background: var(--bg-tertiary); }

        .logo-icon {
            width: 32px; height: 32px; background: var(--accent);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; flex-shrink: 0;
        }

        .header-center { flex: 1; max-width: 640px; margin: 0 24px; display: flex; align-items: center; }

        .search-box {
            flex: 1; display: flex; border: 1px solid var(--border);
            border-radius: 40px; overflow: hidden; background: var(--bg-primary);
            transition: border-color var(--transition);
        }
        .search-box:focus-within { border-color: var(--accent); }

        .search-input {
            flex: 1; padding: 8px 16px; border: none; outline: none;
            font-size: 14px; background: transparent; color: var(--text-primary);
        }
        .search-input::placeholder { color: var(--text-muted); }

        .search-btn {
            padding: 0 20px; background: var(--bg-tertiary); border: none;
            border-left: 1px solid var(--border); cursor: pointer;
            color: var(--text-secondary); transition: background var(--transition);
        }
        .search-btn:hover { background: var(--bg-hover); }

        .header-right { display: flex; align-items: center; gap: 4px; }

        /* ── User avatar + dropdown ── */
        .user-menu { position: relative; }

        .avatar {
            width: 32px; height: 32px; border-radius: var(--radius-full);
            background: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 500; cursor: pointer;
            flex-shrink: 0; transition: opacity var(--transition);
        }
        .avatar:hover { opacity: 0.85; }

        .user-dropdown {
            position: absolute; top: 44px; right: 0;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: 0 4px 24px var(--shadow);
            min-width: 200px; padding: 8px 0; display: none; z-index: 1001;
        }
        .user-dropdown.show { display: block; }

        .dropdown-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .dropdown-name { font-weight: 500; font-size: 14px; }
        .dropdown-email { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .dropdown-role {
            display: inline-block; margin-top: 4px; padding: 2px 8px;
            background: var(--bg-tertiary); border-radius: 12px;
            font-size: 11px; font-weight: 500; color: var(--text-secondary);
        }
        .dropdown-role.official { background: #e8f5e9; color: #2e7d32; }
        .dropdown-role.premium { background: #fff8e1; color: #f57f17; }

        .dropdown-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; font-size: 14px; color: var(--text-primary);
            cursor: pointer; border: none; background: none; width: 100%;
            text-align: left; transition: background var(--transition);
        }
        .dropdown-item:hover { background: var(--bg-tertiary); }
        .dropdown-item svg { flex-shrink: 0; }
        .dropdown-item.danger { color: var(--error); }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; top: var(--header-height); left: 0;
            width: var(--sidebar-width); height: calc(100vh - var(--header-height));
            background: var(--bg-secondary); padding: 12px 0;
            transform: translateX(-100%); transition: transform 0.3s ease;
            z-index: 999; overflow-y: auto; border-right: 1px solid var(--border);
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-item {
            display: flex; align-items: center; gap: 24px;
            padding: 10px 24px; cursor: pointer; color: var(--text-primary);
            text-decoration: none; border: none; background: none; width: 100%;
            font-size: 14px; font-family: inherit;
            transition: background var(--transition);
        }
        .sidebar-item:hover { background: var(--bg-tertiary); }
        .sidebar-item.active { background: var(--bg-tertiary); font-weight: 500; }
        .sidebar-item svg { flex-shrink: 0; }

        .sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px; }

        /* ── Main ── */
        .main-content {
            margin-top: var(--header-height);
            margin-left: 0; padding: 24px;
            transition: margin-left 0.3s ease;
        }
        .main-content.sidebar-open { margin-left: var(--sidebar-width); }

        /* ── Category pills ── */
        .category-bar {
            display: flex; gap: 8px; margin-bottom: 24px;
            overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .category-pill {
            padding: 8px 16px; background: var(--bg-tertiary);
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            white-space: nowrap; color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
        }
        .category-pill:hover { background: var(--bg-hover); }
        .category-pill.active { background: var(--text-primary); color: var(--bg-primary); }

        /* ── Video grid ── */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            cursor: pointer; text-decoration: none; color: inherit;
            border-radius: var(--radius-md); overflow: hidden;
            transition: transform var(--transition);
        }
        .video-card:hover { transform: translateY(-2px); }

        .thumbnail-container {
            position: relative; width: 100%; padding-top: 56.25%;
            background: var(--bg-tertiary); border-radius: var(--radius-md);
            overflow: hidden;
        }
        .thumbnail {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-size: 48px;
        }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }

        .duration-badge {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 2px 6px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .premium-badge {
            position: absolute; top: 8px; left: 8px;
            background: #ffd700; color: #0f0f0f;
            padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 700;
        }
        .encrypted-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.8); color: #ffd700;
            padding: 2px 6px; border-radius: 4px;
            font-size: 11px; font-weight: 700;
        }
        .type-badge {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 2px 6px; border-radius: 4px;
            font-size: 11px; font-weight: 500;
        }

        .video-info { display: flex; gap: 12px; padding: 12px 4px; }

        .channel-avatar {
            width: 36px; height: 36px; border-radius: var(--radius-full);
            background: var(--accent); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 500;
        }
        .channel-avatar img { width: 100%; height: 100%; border-radius: var(--radius-full); object-fit: cover; }

        .video-details { flex: 1; min-width: 0; }

        .video-title {
            font-size: 14px; font-weight: 500; line-height: 1.4;
            margin-bottom: 4px; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; color: var(--text-primary);
        }
        .video-title:hover { color: var(--accent); }

        .channel-name { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
        .channel-name:hover { color: var(--text-primary); }

        .video-meta { font-size: 12px; color: var(--text-secondary); }

        /* ── Skeleton loading ── */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-hover) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }
        .skeleton-card .thumbnail-container { border-radius: var(--radius-md); }
        .skeleton-card .skeleton-thumb { padding-top: 56.25%; }
        .skeleton-card .skeleton-line { height: 14px; margin-bottom: 8px; border-radius: 4px; }
        .skeleton-card .skeleton-line.w-75 { width: 75%; }
        .skeleton-card .skeleton-line.w-50 { width: 50%; }
        .skeleton-card .skeleton-line.w-30 { width: 30%; }
        .skeleton-card .skeleton-avatar { width: 36px; height: 36px; border-radius: var(--radius-full); }

        /* ── Empty / Error states ── */
        .empty-state {
            grid-column: 1 / -1; text-align: center;
            padding: 80px 24px; color: var(--text-muted);
        }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.4; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-primary); }
        .empty-state p { font-size: 14px; }

        .error-state {
            grid-column: 1 / -1; text-align: center;
            padding: 60px 24px; color: var(--error);
        }

        /* ── Upload button ── */
        .upload-btn {
            background: var(--accent); color: white;
            border: none; padding: 8px 16px; border-radius: 18px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: background var(--transition), opacity var(--transition);
        }
        .upload-btn:hover { background: var(--accent-hover); }
        .upload-btn:disabled { background: var(--bg-hover); cursor: not-allowed; color: var(--text-muted); }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary); border-radius: var(--radius-lg);
            width: 100%; max-width: 560px; max-height: 90vh;
            overflow-y: auto; box-shadow: 0 8px 40px var(--shadow);
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 1;
        }
        .modal-title { font-size: 18px; font-weight: 500; }

        .modal-body { padding: 24px; }

        .close-btn {
            background: transparent; border: none; font-size: 24px;
            cursor: pointer; color: var(--text-secondary);
            width: 36px; height: 36px; border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            transition: background var(--transition);
        }
        .close-btn:hover { background: var(--bg-tertiary); }

        /* ── Form ── */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 500;
            margin-bottom: 6px; color: var(--text-secondary);
        }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; font-family: inherit;
            background: var(--bg-primary); color: var(--text-primary);
            transition: border-color var(--transition);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .submit-btn {
            width: 100%; padding: 12px;
            background: var(--accent); color: white;
            border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 500; cursor: pointer;
            transition: background var(--transition), opacity var(--transition);
        }
        .submit-btn:hover { background: var(--accent-hover); }
        .submit-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: not-allowed; }

        .file-drop-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-md);
            padding: 40px 24px; text-align: center; cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
        }
        .file-drop-zone:hover { border-color: var(--accent); }
        .file-drop-zone.dragover {
            border-color: var(--accent); background: rgba(6,95,212,0.06);
        }
        .file-drop-zone p { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .file-drop-zone .hint { font-size: 12px; color: var(--text-muted); }

        .file-info {
            margin-top: 10px; padding: 10px 12px;
            background: var(--bg-tertiary); border-radius: var(--radius-sm);
            font-size: 13px; color: var(--text-primary);
            display: flex; align-items: center; gap: 8px;
        }
        .file-info .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .progress-bar {
            width: 100%; height: 4px; background: var(--bg-tertiary);
            border-radius: 2px; margin-top: 12px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--accent);
            width: 0%; transition: width 0.3s ease;
        }

        .status-message {
            margin-top: 12px; padding: 12px; border-radius: var(--radius-sm);
            font-size: 14px;
        }
        .status-message.success { background: var(--success-bg); color: var(--success); }
        .status-message.error   { background: var(--error-bg); color: var(--error); }

        /* ── Player modal ── */
        .player-modal .modal {
            max-width: 960px; background: #000;
        }
        .player-container {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden;
        }
        .player-container video,
        .player-container audio,
        .player-container iframe {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: none;
        }
        .player-info {
            padding: 20px 24px; background: var(--bg-secondary);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .player-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text-primary); }
        .player-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
        .player-meta .divider { width: 1px; height: 14px; background: var(--border); }
        .player-desc { margin-top: 12px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
        .player-uploader {
            display: flex; align-items: center; gap: 10px; margin-top: 16px;
            padding-top: 16px; border-top: 1px solid var(--border);
        }
        .player-uploader .channel-avatar { width: 40px; height: 40px; font-size: 16px; }
        .player-uploader .name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .player-uploader .role { font-size: 12px; color: var(--text-secondary); }

        /* ── Theme toggle ── */
        .theme-toggle svg.sun { display: none; }
        .theme-toggle svg.moon { display: block; }
        [data-theme="dark"] .theme-toggle svg.sun { display: block; }
        [data-theme="dark"] .theme-toggle svg.moon { display: none; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .header-center { display: none; }
            .sidebar { width: 100%; }
            .main-content.sidebar-open { margin-left: 0; }
            .video-grid { grid-template-columns: 1fr; gap: 16px; }
        }
        @media (min-width: 769px) {
            .search-box-mobile { display: none !important; }
        }
        @media (max-width: 768px) {
            .search-box-desktop { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <button class="icon-btn" id="menuToggle" aria-label="菜单">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <a href="/" class="logo">
                <div class="logo-icon">▶</div>
                ZenGlance
            </a>
        </div>

        <div class="header-center">
            <div class="search-box search-box-desktop">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索内容..." autocomplete="off">
                <button class="search-btn" id="searchBtn" aria-label="搜索">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="header-right">
            <button class="upload-btn" id="uploadBtn" title="上传内容" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2zm3-7H3v12h14v-6.39l4 1.83V8.56l-4 1.83V6m1-1v3.83L22 7v8l-4-1.83V19H2V5h16z"/>
                </svg>
                上传
            </button>
            <button class="icon-btn theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
            </button>
            <div class="user-menu">
                <div class="avatar" id="userAvatar" title="未登录">U</div>
                <div class="user-dropdown" id="userDropdown">
                    <div class="dropdown-header" id="dropdownHeader" style="display:none;">
                        <div class="dropdown-name" id="dropdownName"></div>
                        <div class="dropdown-email" id="dropdownEmail"></div>
                        <span class="dropdown-role" id="dropdownRole"></span>
                    </div>
                    <button class="dropdown-item" id="dropdownLogin">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
                        登录
                    </button>
                    <button class="dropdown-item" id="dropdownLogout" style="display:none;">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        登出
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile search -->
    <div class="search-box search-box-mobile" style="position:fixed; top:var(--header-height); left:0; right:0; z-index:998; padding:8px 16px; background:var(--bg-secondary); display:none; border-bottom:1px solid var(--border);">
        <input type="text" class="search-input" id="searchInputMobile" placeholder="搜索内容..." autocomplete="off" style="width:100%;">
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-item active" data-category="全部">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>首页</span>
        </button>
        <div class="sidebar-divider"></div>
        <button class="sidebar-item" data-category="短片短剧">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M18.7 8.7H5.3V7h13.4v1.7zm-1.5-2.5l-5.2-5.2-5.2 5.2H1.5v11.5h21V6.2h-5.3zm-1.7 9.3h-7V9h7v6.5z"/></svg>
            <span>短片短剧</span>
        </button>
        <button class="sidebar-item" data-category="剧集">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            <span>剧集</span>
        </button>
        <button class="sidebar-item" data-category="电影">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-4zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
            <span>电影</span>
        </button>
        <button class="sidebar-item" data-category="UGC 视频">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
            <span>UGC 视频</span>
        </button>
        <button class="sidebar-item" data-category="短视频">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <span>短视频</span>
        </button>
        <button class="sidebar-item" data-category="音乐">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
            <span>音乐</span>
        </button>
        <button class="sidebar-item" data-category="播客">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
            <span>播客</span>
        </button>
        <button class="sidebar-item" data-category="小说">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1v0zM14 18.5c-.75-.35-2.25-.75-3.5-.75s-2.75.4-3.5.75V7.5c.75-.35 2.25-.75 3.5-.75s2.75.4 3.5.75v11z"/></svg>
            <span>小说</span>
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="category-bar" id="categoryBar">
            <button class="category-pill active" data-type="全部">全部</button>
            <button class="category-pill" data-type="短片短剧">短片短剧</button>
            <button class="category-pill" data-type="剧集">剧集</button>
            <button class="category-pill" data-type="电影">电影</button>
            <button class="category-pill" data-type="UGC 视频">UGC 视频</button>
            <button class="category-pill" data-type="短视频">短视频</button>
            <button class="category-pill" data-type="音乐">音乐</button>
            <button class="category-pill" data-type="播客">播客</button>
            <button class="category-pill" data-type="小说">小说</button>
        </div>

        <div class="video-grid" id="videoGrid">
            <!-- Skeleton placeholders -->
            <div class="skeleton-card" id="skeleton1"></div>
            <div class="skeleton-card" id="skeleton2"></div>
            <div class="skeleton-card" id="skeleton3"></div>
            <div class="skeleton-card" id="skeleton4"></div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">上传内容</h2>
                <button class="close-btn" id="closeUploadModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="form-group">
                        <label class="form-label">内容类型</label>
                        <select class="form-select" id="contentType" required>
                            <option value="">选择类型...</option>
                            <option value="short_drama">短片短剧</option>
                            <option value="tv_series">剧集</option>
                            <option value="movie">电影</option>
                            <option value="ugc_long_video">UGC 长视频</option>
                            <option value="short_video">短视频</option>
                            <option value="music">音乐</option>
                            <option value="podcast">播客</option>
                            <option value="novel">小说</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">标题 <span style="color:var(--error)">*</span></label>
                        <input type="text" class="form-input" id="contentTitle" required placeholder="输入标题..." maxlength="200">
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea class="form-textarea" id="contentDescription" placeholder="输入描述..." maxlength="1000" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">选择文件</label>
                        <div class="file-drop-zone" id="dropZone">
                            <svg viewBox="0 0 24 24" width="48" height="48" style="margin:0 auto 12px; display:block;">
                                <path fill="var(--text-muted)" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                            </svg>
                            <p>拖拽文件到此处，或点击选择文件</p>
                            <p class="hint">支持视频 / 音频 / 文档格式</p>
                        </div>
                        <input type="file" id="fileInput" style="display:none;" required>
                        <div class="file-info" id="fileInfo" style="display:none;">
                            <svg viewBox="0 0 24 24" width="16" height="16" style="flex-shrink:0"><path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
                            <span class="file-name" id="fileName"></span>
                            <span class="file-size" id="fileSize"></span>
                        </div>
                        <div class="progress-bar" id="progressBar" style="display:none;">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    <div id="statusMessage"></div>
                    <button type="submit" class="submit-btn" id="submitBtn">开始上传</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div class="modal-overlay player-modal" id="playerModal">
        <div class="modal" style="max-width:960px;">
            <div class="player-container" id="playerContainer">
                <!-- Dynamic player -->
            </div>
            <div class="player-info">
                <h2 class="player-title" id="playerTitle"></h2>
                <div class="player-meta">
                    <span id="playerViews"></span>
                    <span class="divider"></span>
                    <span id="playerDate"></span>
                    <span id="playerTypeBadge"></span>
                    <span id="playerPremiumBadge" style="display:none;"><span class="premium-badge" style="position:static;">PREMIUM</span></span>
                    <span id="playerEncryptedBadge" style="display:none;">🔒 加密</span>
                </div>
                <p class="player-desc" id="playerDesc"></p>
                <div class="player-uploader" id="playerUploader">
                    <div class="channel-avatar" id="playerAvatar"></div>
                    <div>
                        <div class="name" id="playerUploaderName"></div>
                        <div class="role" id="playerUploaderRole"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>

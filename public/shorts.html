<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title data-i18n="meta.titleShorts">Shorts — ZenGlance</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; }

    .shorts-header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      z-index: 200;
      pointer-events: none;
    }
    .shorts-header > * { pointer-events: auto; }
    .shorts-logo {
      font-size: 18px; font-weight: 800;
      background: linear-gradient(135deg, #3ea6ff, #7b2fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .shorts-back {
      color: #fff; font-size: 13px; display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.12); border: none; padding: 6px 12px;
      border-radius: 20px; cursor: pointer;
    }

    .shorts-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .shorts-container::-webkit-scrollbar { display: none; }

    .shorts-card {
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      overflow: hidden;
    }
    .shorts-video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .shorts-thumbnail {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .shorts-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.3); font-size: 48px;
    }

    /* Play overlay */
    .shorts-play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .shorts-play-overlay.show { opacity: 1; }
    .shorts-play-overlay svg { filter: drop-shadow(0 2px 12px rgba(0,0,0,0.6)); }

    /* Right action buttons */
    .shorts-actions {
      position: absolute;
      right: 12px; bottom: 140px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      z-index: 10;
    }
    html[dir="rtl"] .shorts-actions { right: auto; left: 12px; }
    .shorts-action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #fff; background: none; border: none; cursor: pointer;
    }
    .shorts-action-btn .icon-circle {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .shorts-action-btn:active .icon-circle { background: rgba(255,255,255,0.3); }
    .shorts-action-btn span { font-size: 11px; color: rgba(255,255,255,0.8); }

    /* Bottom info */
    .shorts-info {
      position: absolute;
      left: 12px; right: 70px; bottom: 80px;
      z-index: 10;
      color: #fff;
    }
    html[dir="rtl"] .shorts-info { left: 70px; right: 12px; }
    .shorts-creator {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .shorts-creator-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #7b2fff, #3ea6ff);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
    }
    .shorts-creator-name {
      font-size: 14px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .shorts-title {
      font-size: 14px; line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .shorts-meta {
      font-size: 12px; color: rgba(255,255,255,0.6);
      display: flex; gap: 12px;
    }
    .shorts-tag {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px;
    }

    /* Bottom nav */
    .shorts-bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: space-around;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .shorts-nav-btn {
      color: rgba(255,255,255,0.6);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; cursor: pointer; background: none; border: none;
    }
    .shorts-nav-btn.active { color: #fff; }
    .shorts-nav-btn svg { width: 24px; height: 24px; }
    .shorts-upload-btn {
      width: 44px; height: 28px;
      background: linear-gradient(90deg, #00f2ea, #ff0050);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .shorts-upload-btn-inner {
      width: 36px; height: 22px;
      background: #fff; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #000; font-weight: 700;
    }

    .shorts-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5); font-size: 14px;
    }
    .shorts-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: rgba(255,255,255,0.5);
    }
    .shorts-empty svg { width: 48px; height: 48px; opacity: 0.3; }

    @media (min-width: 769px) {
      .shorts-container { max-width: 420px; margin: 0 auto; border-left: 1px solid #222; border-right: 1px solid #222; }
      .shorts-bottom-nav { max-width: 420px; left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <!-- Header overlay -->
  <div class="shorts-header">
    <button class="shorts-back" onclick="window.location.href='/'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span data-i18n="meta.back">Back</span>
    </button>
    <div class="shorts-logo">Shorts</div>
    <div class="lang-wrapper">
      <button class="lang-btn" id="langBtn" aria-label="Change language">
        <span>GB</span>
        <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
        <button class="lang-option" data-lang="fr" data-lang-label="Fran\u00E7ais"><span>FR</span> Fran\u00E7ais</button>
        <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
        <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
        <button class="lang-option" data-lang="es" data-lang-label="Espa\u00F1ol"><span>ES</span> Espa\u00F1ol</button>
        <button class="lang-option" data-lang="ar" data-lang-label="\u0627\u0644\u0639\u0631\u0628\u064A\u0629"><span>SA</span> \u0627\u0644\u0639\u0631\u0628\u064A\u0629</button>
      </div>
    </div>
  </div>

  <!-- Shorts feed -->
  <div class="shorts-container" id="shortsContainer">
    <div class="shorts-loading" id="shortsLoading">
      <span data-i18n="status.loading">Loading...</span>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="shorts-bottom-nav">
    <button class="shorts-nav-btn" onclick="window.location.href='/'">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="menu.home">Home</span>
    </button>
    <button class="shorts-nav-btn active">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 10l3 2-3 2V10z" fill="currentColor"/></svg>
      <span data-i18n="menu.short_video">Shorts</span>
    </button>
    <button class="shorts-nav-btn" onclick="window.location.href='/auth/login'">
      <div class="shorts-upload-btn"><div class="shorts-upload-btn-inner">+</div></div>
    </button>
    <button class="shorts-nav-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="meta.notifications">Notifications</span>
    </button>
    <button class="shorts-nav-btn" id="shortsProfileBtn">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="meta.profile">Profile</span>
    </button>
  </nav>

  <script src="i18n.js?v=4"></script>
  <script>
    (function() {
      'use strict';

      const container = document.getElementById('shortsContainer');
      let shorts = [];
      let currentIndex = 0;
      let currentVideo = null;
      let loading = false;
      let page = 1;

      // Build language selector
      function buildLangSelector() {
        var btn = document.getElementById('langBtn');
        var dropdown = document.getElementById('langDropdown');
        if (!btn || !dropdown) return;
        dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdown.classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
          if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.classList.remove('show');
          }
        });
        document.querySelectorAll('.lang-option').forEach(function(opt) {
          opt.addEventListener('click', function(e) {
            e.stopPropagation();
            window.i18n.setLang(opt.dataset.lang);
            dropdown.classList.remove('show');
          });
        });
      }

      function t(key, params) {
        return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : key;
      }

      function formatViews(n) {
        if (!n) return '';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(n);
      }

      function timeAgo(iso) {
        if (!iso) return '';
        var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (diff < 60) return t('timeAgo.justNow');
        if (diff < 3600) return t('timeAgo.minutesAgo', { n: Math.floor(diff / 60) });
        if (diff < 86400) return t('timeAgo.hoursAgo', { n: Math.floor(diff / 3600) });
        if (diff < 2592000) return t('timeAgo.daysAgo', { n: Math.floor(diff / 86400) });
        return t('timeAgo.monthsAgo', { n: Math.floor(diff / 2592000) });
      }

      function escapeHtml(str) {
        if (!str) return '';
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      async function fetchShorts(p) {
        var token = localStorage.getItem('zenglance_token');
        try {
          var res = await fetch('/api/v1/content?category=short_video&page=' + p + '&limit=10', {
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
          });
          if (!res.ok) return [];
          var data = await res.json();
          return data.data || [];
        } catch (e) {
          console.error('Failed to load shorts:', e);
          return [];
        }
      }

      function createShortCard(video, index) {
        var card = document.createElement('div');
        card.className = 'shorts-card';
        card.dataset.index = index;

        var videoSrc = video.file_url || '';
        var hasVideo = videoSrc && /\.(mp4|webm|ogg)(\?|$)/i.test(videoSrc);

        card.innerHTML =
          (hasVideo
            ? '<video class="shorts-video" src="' + escapeHtml(videoSrc) + '" loop playsinline preload="none"></video>'
            : (video.thumbnail
              ? '<img class="shorts-thumbnail" src="' + escapeHtml(video.thumbnail) + '" alt="" />'
              : '<div class="shorts-placeholder">\u25B6</div>')
          ) +
          '<div class="shorts-play-overlay" id="playOverlay' + index + '">' +
            '<svg width="64" height="64" viewBox="0 0 64 64" fill="none">' +
              '<circle cx="32" cy="32" r="30" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>' +
              '<path d="M26 20l20 12-20 12V20z" fill="white"/>' +
            '</svg>' +
          '</div>' +
          '<div class="shorts-actions">' +
            '<button class="shorts-action-btn" onclick="event.stopPropagation()">' +
              '<div class="icon-circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></div>' +
              '<span id="likeCount' + index + '">' + (video.likes || 0) + '</span>' +
            '</button>' +
            '<button class="shorts-action-btn" onclick="event.stopPropagation()">' +
              '<div class="icon-circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" stroke="currentColor" stroke-width="1.8"/></svg></div>' +
              '<span>' + (video.comments || 0) + '</span>' +
            '</button>' +
            '<button class="shorts-action-btn" onclick="event.stopPropagation()">' +
              '<div class="icon-circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" stroke="currentColor" stroke-width="1.8"/><polyline points="16 6 12 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="2" x2="12" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>' +
              '<span>' + t('meta.share') + '</span>' +
            '</button>' +
          '</div>' +
          '<div class="shorts-info">' +
            '<div class="shorts-creator">' +
              '<div class="shorts-creator-avatar">' + ((video.creator && video.creator.name) ? video.creator.name.charAt(0).toUpperCase() : 'U') + '</div>' +
              '<div class="shorts-creator-name">' + escapeHtml(video.creator && video.creator.name ? video.creator.name : t('player.unknownCreator')) + '</div>' +
            '</div>' +
            '<div class="shorts-title">' + escapeHtml(video.title) + '</div>' +
            '<div class="shorts-meta">' +
              (video.views ? '<span>' + formatViews(video.views) + ' ' + t('player.views') + '</span>' : '') +
              (video.duration ? '<span>' + formatDuration(video.duration) + '</span>' : '') +
              '<span>' + timeAgo(video.created_at) + '</span>' +
            '</div>' +
          '</div>';

        // Tap to play/pause
        card.addEventListener('click', function() {
          var videoEl = card.querySelector('video');
          var overlay = document.getElementById('playOverlay' + index);
          if (videoEl) {
            if (videoEl.paused) {
              videoEl.play();
              if (overlay) overlay.classList.remove('show');
            } else {
              videoEl.pause();
              if (overlay) overlay.classList.add('show');
            }
          }
        });

        return card;
      }

      function formatDuration(seconds) {
        if (!seconds) return '';
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return m + ':' + s.toString().padStart(2, '0');
      }

      async function loadMore() {
        if (loading) return;
        loading = true;
        var more = await fetchShorts(page);
        if (more.length === 0) {
          document.getElementById('shortsLoading')?.remove();
          if (shorts.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'shorts-empty';
            empty.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><p>' + t('status.empty') + '</p>';
            container.appendChild(empty);
          }
          loading = false;
          return;
        }
        document.getElementById('shortsLoading')?.remove();
        more.forEach(function(video, i) {
          var globalIndex = shorts.length + i;
          shorts.push(video);
          container.appendChild(createShortCard(video, globalIndex));
        });
        page++;
        loading = false;
      }

      // Intersection observer to auto-play visible video
      function setupObserver() {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            var idx = parseInt(entry.target.dataset.index);
            var videoEl = entry.target.querySelector('video');
            if (entry.isIntersecting) {
              currentIndex = idx;
              if (videoEl && currentVideo !== idx) {
                if (currentVideo !== null) {
                  var prev = container.querySelector('[data-index="' + currentVideo + '"] video');
                  if (prev) { prev.pause(); prev.currentTime = 0; }
                }
                videoEl.play().catch(function() {});
                currentVideo = idx;
              }
            } else {
              if (videoEl) { videoEl.pause(); }
            }
          });
        }, { threshold: 0.7 });

        // Observe existing cards
        container.querySelectorAll('.shorts-card').forEach(function(card) {
          observer.observe(card);
        });

        // Save observer for new cards
        window._shortsObserver = observer;
      }

      // Scroll-based infinite load
      container.addEventListener('scroll', function() {
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 200) {
          loadMore();
        }
      });

      // Init
      function init() {
        buildLangSelector();
        if (window.i18n && window.i18n.onLangChange) {
          window.i18n.onLangChange(function() {
            // Re-render visible card info on lang change
            var activeCard = container.querySelector('.shorts-card[style*=""], .shorts-card:nth-child(' + (currentIndex + 2) + ')');
            // Force re-apply translations for static elements
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
              el.textContent = window.i18n.t(el.dataset.i18n);
            });
          });
        }
        loadMore().then(function() {
          setupObserver();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - ZenGlance</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="i18n.js?v=4"></script>
  <style>
    .profile-page { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .profile-back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; cursor: pointer; margin-bottom: 1.5rem; text-decoration: none; }
    .profile-back:hover { color: var(--accent); }

    .profile-header {
      display: flex; gap: 1.5rem; align-items: flex-start;
      margin-bottom: 2rem; padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; flex-shrink: 0;
    }
    .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .profile-bio { font-size: 14px; color: var(--text-secondary); margin-bottom: 0.75rem; }
    .profile-stats { display: flex; gap: 1.5rem; }
    .profile-stat { text-align: center; }
    .profile-stat-value { font-size: 1.25rem; font-weight: 700; }
    .profile-stat-label { font-size: 12px; color: var(--text-muted); }
    .profile-role {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 11px; font-weight: 600; margin-left: 0.5rem;
    }
    .profile-role.admin { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .profile-role.senior { background: rgba(123,47,255,0.2); color: #b388ff; }
    .profile-role.free { background: rgba(100,200,100,0.2); color: #6fcf6f; }

    .profile-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
    .profile-tab {
      padding: 0.75rem 1.5rem; font-size: 14px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .profile-tab.active { color: var(--accent); border-color: var(--accent); }
    .profile-tab:hover { color: var(--text-primary); }

    .profile-section { display: none; }
    .profile-section.active { display: block; }

    .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .profile-content-item {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); overflow: hidden;
      transition: background var(--transition);
    }
    .profile-content-item:hover { background: var(--bg-hover); }
    .profile-content-thumb {
      aspect-ratio: 16/9; background: var(--bg-secondary);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2); font-size: 24px;
    }
    .profile-content-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .profile-content-info { padding: 0.5rem 0.75rem; }
    .profile-content-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-content-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .profile-content-link { text-decoration: none; color: inherit; display: block; }

    .profile-empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .profile-loading { text-align: center; padding: 2rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text">ZenGlance</span>
      </a>
    </div>
    <div class="header-right" id="headerRight"></div>
  </header>

  <div class="profile-page">
    <a href="/" class="profile-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>

    <div id="profileContent">
      <div class="profile-loading">Loading...</div>
    </div>
  </div>

  <script>
    var userId = new URLSearchParams(window.location.search).get('id');
    var currentTab = 'content';
    var followState = false;

    function escapeHtml(str) {
      if (!str) return '';
      var d = document.createElement('div'); d.textContent = str;
      return d.innerHTML;
    }

    function timeAgo(iso) {
      if (!iso) return '';
      var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    function formatViews(n) {
      if (!n) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
      return String(n);
    }

    function t(key) {
      if (!window.i18n) return key;
      return window.i18n.t(key);
    }

    async function apiFetch(url, options) {
      var token = localStorage.getItem('zenglance_token');
      var headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
      return fetch(url, { ...options, headers });
    }

    async function loadUser() {
      var token = localStorage.getItem('zenglance_token');
      var headerRight = document.getElementById('headerRight');
      if (!token) {
        headerRight.innerHTML = '<a href="/login.html" class="login-btn">Login</a>';
        return null;
      }
      try {
        var res = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) { localStorage.removeItem('zenglance_token'); return null; }
        var data = await res.json();
        headerRight.innerHTML =
          '<div class="user-menu" style="position:relative">' +
            '<button class="user-menu-btn" onclick="toggleMenu(event)">' +
              '<div class="user-avatar" style="background:var(--accent);color:#fff;font-size:12px;font-weight:700;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + (data.user.name || 'U').charAt(0).toUpperCase() + '</div>' +
              '<span class="user-name">' + escapeHtml(data.user.name) + '</span>' +
              '<svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 8L2 4h8z"/></svg>' +
            '</button>' +
            '<div class="user-dropdown" id="userDropdown" style="display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);min-width:160px;z-index:100;overflow:hidden;">' +
              '<a href="#" class="dropdown-item" onclick="window.location.href=\'' + (userId || '/profile.html') + '\'">Profile</a>' +
              '<div class="dropdown-divider"></div>' +
              '<a href="#" class="dropdown-item" onclick="logout();return false;">Logout</a>' +
            '</div>' +
          '</div>';
        return data.user;
      } catch (e) { return null; }
    }

    function toggleMenu(e) {
      e.stopPropagation();
      var dd = document.getElementById('userDropdown');
      dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    }

    function logout() {
      localStorage.removeItem('zenglance_token');
      window.location.href = '/';
    }

    document.addEventListener('click', function() {
      var dd = document.getElementById('userDropdown');
      if (dd) dd.style.display = 'none';
    });

    async function loadProfile(user) {
      var isSelf = !userId || userId === user.id;
      var targetId = userId || user.id;
      var container = document.getElementById('profileContent');

      try {
        var profileRes = await apiFetch('/api/interaction/users/' + targetId);
        var profile = await profileRes.json();
        if (profile.error) { container.innerHTML = '<div class="profile-empty">User not found</div>'; return; }

        if (!isSelf) {
          var followRes = await apiFetch('/api/interaction/users/' + targetId + '/followers');
          var followData = await followRes.json();
          followState = followData.following || false;
        }

        var roleClass = profile.role || 'free';
        var avatarHtml = profile.avatar
          ? '<img src="' + escapeHtml(profile.avatar) + '" alt=""/>'
          : (profile.name || 'U').charAt(0).toUpperCase();

        container.innerHTML =
          '<div class="profile-header">' +
            '<div class="profile-avatar">' + avatarHtml + '</div>' +
            '<div class="profile-info">' +
              '<div class="profile-name">' + escapeHtml(profile.name || 'Unknown') +
                '<span class="profile-role ' + roleClass + '">' + profile.role + '</span>' +
              '</div>' +
              (profile.bio ? '<div class="profile-bio">' + escapeHtml(profile.bio) + '</div>' : '') +
              '<div class="profile-stats">' +
                '<div class="profile-stat"><div class="profile-stat-value">' + (profile.followerCount || 0) + '</div><div class="profile-stat-label">Followers</div></div>' +
                '<div class="profile-stat"><div class="profile-stat-value">' + (profile.followingCount || 0) + '</div><div class="profile-stat-label">Following</div></div>' +
                '<div class="profile-stat"><div class="profile-stat-value">' + timeAgo(profile.createdAt) + '</div><div class="profile-stat-label">Joined</div></div>' +
              '</div>' +
              (!isSelf ? '<button class="watch-follow-btn" id="profileFollowBtn" style="margin-top:1rem" onclick="toggleProfileFollow(\'' + targetId + '\')">' + (followState ? 'Following' : 'Follow') + '</button>' : '') +
            '</div>' +
          '</div>' +
          '<div class="profile-tabs">' +
            '<div class="profile-tab active" data-tab="content">Content</div>' +
            '<div class="profile-tab" data-tab="history">' + (isSelf ? 'History' : '') + '</div>' +
          '</div>' +
          '<div class="profile-section active" id="section-content"></div>' +
          '<div class="profile-section" id="section-history"></div>';

        if (isSelf) loadMyContent();
        else loadUserContent(targetId);

        document.querySelectorAll('.profile-tab').forEach(function(tab) {
          tab.addEventListener('click', function() {
            document.querySelectorAll('.profile-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.profile-section').forEach(function(s) { s.classList.remove('active'); });
            tab.classList.add('active');
            var sectionId = 'section-' + tab.dataset.tab;
            document.getElementById(sectionId).classList.add('active');
            if (tab.dataset.tab === 'history' && isSelf) loadHistory();
          });
        });
      } catch (e) { console.error(e); }
    }

    async function loadUserContent(targetId) {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-content');
      try {
        var res = await fetch('/api/content?uploader=' + targetId + '&limit=20', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await res.json();
        var items = data.data || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">No content yet</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">Failed to load</div>'; }
    }

    async function loadMyContent() {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-content');
      try {
        var res = await fetch('/api/content?limit=20', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await res.json();
        var items = data.data || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">No content yet</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">Failed to load</div>'; }
    }

    async function loadHistory() {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-history');
      grid.innerHTML = '<div class="profile-loading">Loading...</div>';
      try {
        var res = await apiFetch('/api/interaction/history?limit=30');
        var data = await res.json();
        var items = data.history || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">No watch history yet</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">Failed to load</div>'; }
    }

    function renderContentGrid(container, items) {
      container.innerHTML = '<div class="profile-grid">';
      items.forEach(function(item) {
        var el = document.createElement('a');
        el.className = 'profile-content-item';
        el.href = '/watch.html?id=' + item.id;
        el.innerHTML =
          '<div class="profile-content-thumb">' +
            (item.thumbnail ? '<img src="' + escapeHtml(item.thumbnail) + '" alt=""/>' : '\u25B6') +
          '</div>' +
          '<div class="profile-content-info">' +
            '<div class="profile-content-title">' + escapeHtml(item.title) + '</div>' +
            '<div class="profile-content-meta">' +
              (item.views ? formatViews(item.views) + ' views' : '') +
              (item.duration ? '  \u00B7  ' + Math.floor(item.duration / 60) + ':' + String(item.duration % 60).padStart(2, '0') : '') +
            '</div>' +
          '</div>';
        container.appendChild(el);
      });
      container.innerHTML += '</div>';
    }

    async function toggleProfileFollow(userId) {
      var token = localStorage.getItem('zenglance_token');
      if (!token) { alert('Please login first'); return; }
      followState = !followState;
      var btn = document.getElementById('profileFollowBtn');
      btn.textContent = followState ? 'Following' : 'Follow';
      btn.classList.toggle('active', followState);
      apiFetch('/api/interaction/users/' + userId + '/follow', { method: 'POST' })
        .catch(function() { followState = !followState; btn.textContent = followState ? 'Following' : 'Follow'; btn.classList.toggle('active', followState); });
    }

    function init() {
      if (window.i18n) window.i18n.init();
      loadUser().then(function(user) {
        if (!user) {
          document.getElementById('profileContent').innerHTML =
            '<div class="profile-empty"><p>Please <a href="/login.html">login</a> to view this profile.</p></div>';
          return;
        }
        loadProfile(user);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>

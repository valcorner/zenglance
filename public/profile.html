<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — ZenGlance</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="i18n.js?v=13"></script>
  <style>
    .profile-page { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .profile-back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; cursor: pointer; margin-bottom: 1.5rem; text-decoration: none; }
    .profile-back:hover { color: var(--accent); }

    .profile-header {
      display: flex; gap: 1.5rem; align-items: flex-start;
      margin-bottom: 2rem; padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; flex-shrink: 0; overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .profile-name { font-size: 1.5rem; font-weight: 700; }
    .profile-bio { font-size: 14px; color: var(--text-secondary); margin-bottom: 0.75rem; min-height: 1.4em; }
    .profile-bio-edit { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .profile-bio-edit textarea {
      flex: 1; padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--border-color); background: var(--bg-input);
      color: var(--text-primary); font-size: 14px; resize: vertical; min-height: 60px;
    }
    .profile-bio-edit textarea:focus { outline: none; border-color: var(--accent); }
    .profile-bio-actions { display: flex; gap: 0.5rem; }
    .profile-bio-save, .profile-bio-cancel {
      padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-color);
      background: none; color: var(--text-secondary); transition: background 0.2s, color 0.2s;
    }
    .profile-bio-save:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .profile-bio-cancel:hover { background: var(--bg-hover); }

    .profile-stats { display: flex; gap: 1.5rem; }
    .profile-stat { text-align: center; }
    .profile-stat-value { font-size: 1.25rem; font-weight: 700; }
    .profile-stat-label { font-size: 12px; color: var(--text-muted); }
    .profile-role {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 11px; font-weight: 600; margin-left: 0.5rem;
    }
    .profile-role.admin { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .profile-role.senior { background: rgba(123,47,255,0.2); color: #b388ff; }
    .profile-role.free { background: rgba(100,200,100,0.2); color: #6fcf6f; }

    .profile-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
    .profile-tab {
      padding: 0.75rem 1.5rem; font-size: 14px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .profile-tab.active { color: var(--accent); border-color: var(--accent); }
    .profile-tab:hover { color: var(--text-primary); }

    .profile-section { display: none; }
    .profile-section.active { display: block; }

    .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .profile-content-item {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); overflow: hidden;
      transition: background var(--transition);
    }
    .profile-content-item:hover { background: var(--bg-hover); }
    .profile-content-thumb {
      aspect-ratio: 16/9; background: var(--bg-secondary);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2); font-size: 24px;
    }
    .profile-content-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .profile-content-info { padding: 0.5rem 0.75rem; }
    .profile-content-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-content-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .profile-content-link { text-decoration: none; color: inherit; display: block; }

    .watch-follow-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border-color);
      background: none; color: var(--text-primary); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s;
      margin-top: 1rem;
    }
    .watch-follow-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .watch-follow-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .profile-empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .profile-loading { text-align: center; padding: 2rem; color: var(--text-muted); }
    .profile-error-card {
      text-align: center; padding: 3rem 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); max-width: 400px; margin: 2rem auto;
    }
    .profile-error-card p { font-size: 15px; color: var(--text-secondary); margin-bottom: 1.25rem; line-height: 1.6; }
    .profile-error-card .profile-error-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; border-radius: 20px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: opacity 0.2s;
    }
    .profile-error-card .profile-error-btn:hover { opacity: 0.85; }

    /* ── Language selector (same as index.html) ──────────────────────────── */
    .lang-wrapper { position: relative; display: inline-block; }
    .lang-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: var(--text-primary);
      font-size: 13px; cursor: pointer; line-height: 1;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.14); }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface-2); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 6px; min-width: 150px;
      z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lang-dropdown.show { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 12px; border: none; background: none;
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      border-radius: 6px; text-align: left;
      transition: background 0.1s, color 0.1s;
    }
    .lang-option:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .lang-option.active { color: var(--accent); font-weight: 600; }
    html[dir="rtl"] .lang-dropdown { right: auto; left: 0; }
    html[dir="rtl"] .sidebar { transform: none; }
    html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(8rem); }
    html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 16rem; }
    html[dir="rtl"] .mobile-sidebar-toggle { left: 0.75rem; right: auto; }
    html[dir="rtl"] .dropdown-arrow { transform: rotate(180deg); }
    html[dir="rtl"] .dropdown-arrow.show { transform: rotate(0deg); }
    @media (max-width: 768px) {
      html[dir="rtl"] .sidebar-open .sidebar { transform: translateX(-8rem); }
      html[dir="rtl"] .sidebar-open .main { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="mobile-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <a href="/" class="logo">
        <span class="logo-icon">Z</span>
        <span class="logo-text" data-i18n="meta.title">ZenGlance</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="meta.search" placeholder="Search content..." />
      </div>
    </div>

    <div class="header-right">
      <div class="lang-wrapper">
        <button class="lang-btn" id="langBtn" aria-label="Change language">
          <span>EN</span>
          <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" data-lang-label="English"><span>GB</span> English</button>
          <button class="lang-option" data-lang="fr" data-lang-label="Français"><span>FR</span> Français</button>
          <button class="lang-option" data-lang="de" data-lang-label="Deutsch"><span>DE</span> Deutsch</button>
          <button class="lang-option" data-lang="it" data-lang-label="Italiano"><span>IT</span> Italiano</button>
          <button class="lang-option" data-lang="es" data-lang-label="Español"><span>ES</span> Español</button>
          <button class="lang-option" data-lang="ar" data-lang-label="العربية"><span>SA</span> العربية</button>
        </div>
      </div>

      <button class="upload-btn" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v8M3.5 5.5L7 2l3.5 3.5M2 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meta.upload">Upload</span>
      </button>

      <div class="user-menu" id="userMenu" style="display:none">
        <div class="user-avatar" id="userAvatar">U</div>
        <span class="user-name" id="userName">User</span>
        <svg class="dropdown-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="user-dropdown" id="userDropdown">
          <a href="#" class="dropdown-item" id="profileLink">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1.5 12.5c0-2.5 2-4.5 5.5-4.5s5.5 2 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span data-i18n="meta.profile">Profile</span>
          </a>
          <a href="/admin.html" class="dropdown-item" id="adminLink" style="display:none">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span>Admin</span>
          </a>
          <a href="#" class="dropdown-item" id="logoutBtn" onclick="logout();return false;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5 3H2.5a1.5 1.5 0 00-1.5 1.5v5a1.5 1.5 0 001.5 1.5H5M8.5 10.5L11.5 7.5M11.5 7.5L8.5 4.5M11.5 7.5H4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="meta.logout">Log out</span>
          </a>
        </div>
      </div>
      <a href="/login.html" class="login-btn" id="loginBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M10 3H3a2 2 0 00-2 2v4a2 2 0 002 2h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M11 7V4a1 1 0 00-2 0v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M12 11v1a1 1 0 01-1 1H3a1 1 0 01-1-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="meta.login">Log in</span>
      </a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.home">Home</div>
      <a href="/" class="sidebar-item active">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2.5 8.5L8 3l5.5 5.5V14a.5.5 0 01-.5.5H2.5a.5.5 0 01-.5-.5V8.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M6 14.5V10h4v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="menu.home">Home</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="meta.categories">Categories</div>
      <a href="/" class="sidebar-item" data-category="short_drama">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 13v-2M10 13v-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.short_drama">Short Dramas</span>
      </a>
      <a href="/" class="sidebar-item" data-category="tv_series">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="menu.tv_series">TV Series</span>
      </a>
      <a href="/" class="sidebar-item" data-category="movie">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
        <span data-i18n="menu.movie">Movies</span>
      </a>
      <a href="/" class="sidebar-item" data-category="ugc_long_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.ugc_long_video">UGC Videos</span>
      </a>
      <a href="/" class="sidebar-item" data-category="short_video">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.short_video">Short Videos</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="menu.explorer">Explore</div>
      <a href="/shorts.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M6 8l3 2-3 2V8z" fill="currentColor"/></svg>
        <span data-i18n="menu.shorts">Shorts</span>
      </a>
      <div class="sidebar-title" data-i18n="collection.myCollection">My Collection</div>
      <a href="/collection.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3"/><path d="M5 2V4M11 2V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="collection.myCollection">My Collection</span>
      </a>
    </div>
  </nav>

  <main class="main">
    <div class="profile-page">
      <a href="/" class="profile-back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="meta.back">Back</span>
      </a>

      <div id="profileContent">
        <div class="profile-loading" data-i18n="admin.loading">Loading...</div>
      </div>
    </div>
  </main>

  <script>
    var userId = new URLSearchParams(window.location.search).get('id');
    var currentTab = 'content';
    var followState = false;
    var currentUser = null;
    var profileData = null;

    function escapeHtml(str) {
      if (!str) return '';
      var d = document.createElement('div'); d.textContent = str;
      return d.innerHTML;
    }

    function t(key, params) {
      return (window.i18n && window.i18n.t) ? window.i18n.t(key, params) : (params ? key.replace(/\{(\w+)\}/g, function(_, k) { return params[k] || ''; }) : key);
    }

    function formatViews(n) {
      if (!n) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
      return String(n);
    }

    function timeAgo(ts) {
      if (!ts) return '';
      var diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return t('timeAgo.justNow');
      if (diff < 3600) return t('timeAgo.minutesAgo', { n: Math.floor(diff / 60) });
      if (diff < 86400) return t('timeAgo.hoursAgo', { n: Math.floor(diff / 3600) });
      return t('timeAgo.daysAgo', { n: Math.floor(diff / 86400) });
    }

    async function apiFetch(url, options) {
      options = options || {};
      var token = localStorage.getItem('zenglance_token');
      var headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
      return fetch(url, { ...options, headers });
    }

    async function loadUser() {
      var token = localStorage.getItem('zenglance_token');
      var userMenu = document.getElementById('userMenu');
      var loginBtn = document.getElementById('loginBtn');
      var uploadBtn = document.getElementById('uploadBtn');

      if (!token) {
        if (userMenu) userMenu.style.display = 'none';
        if (loginBtn) loginBtn.style.display = 'inline-flex';
        if (uploadBtn) uploadBtn.style.display = 'none';
        return null;
      }
      try {
        var res = await apiFetch('/auth/me');
        if (!res || !res.ok) {
          if (res && res.status === 401) localStorage.removeItem('zenglance_token');
          if (userMenu) userMenu.style.display = 'none';
          if (loginBtn) loginBtn.style.display = 'inline-flex';
          if (uploadBtn) uploadBtn.style.display = 'none';
          return null;
        }
        var data = await res.json();
        currentUser = data.data;
        if (!currentUser) return null;

        var avatarEl = document.getElementById('userAvatar');
        var nameEl = document.getElementById('userName');
        var profileLink = document.getElementById('profileLink');
        var adminLink = document.getElementById('adminLink');

        if (avatarEl) avatarEl.textContent = (currentUser.name || 'U').slice(0, 2).toUpperCase();
        if (nameEl) nameEl.textContent = currentUser.name;
        if (profileLink) profileLink.href = '/profile.html?id=' + currentUser.id;
        if (adminLink) adminLink.style.display = currentUser.role === 'admin' ? 'flex' : 'none';

        if (userMenu) userMenu.style.display = 'flex';
        if (loginBtn) loginBtn.style.display = 'none';
        if (uploadBtn) uploadBtn.style.display = currentUser.role !== 'free' ? 'inline-flex' : 'none';

        return currentUser;
      } catch (e) { console.error('loadUser error:', e); return null; }
    }

    // ── Navbar interactions (same as index.html) ────────────────────────────
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
      document.body.classList.toggle('sidebar-open');
    });

    document.querySelector('.user-menu')?.addEventListener('click', function() {
      var dd = this.querySelector('.user-dropdown');
      if (dd) dd.classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.user-menu')) {
        var dd = document.querySelector('.user-dropdown');
        if (dd) dd.classList.remove('show');
      }
    });

    document.getElementById('searchInput')?.addEventListener('keyup', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        location.href = '/?q=' + encodeURIComponent(this.value.trim());
      }
    });

    document.getElementById('uploadBtn')?.addEventListener('click', function() {
      location.href = '/';
    });

    async function logout() {
      var token = localStorage.getItem('zenglance_token');
      if (token) { try { await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {} }
      localStorage.removeItem('zenglance_token');
      location.href = '/';
    }
    window.logout = logout;

    async function loadProfile(user) {
      var isSelf = !userId || userId === user.id;
      var targetId = userId || user.id;
      var container = document.getElementById('profileContent');

      try {
        var profileRes = await apiFetch('/api/interaction/users/' + targetId);
        if (!profileRes.ok) {
          var msg = profileRes.status === 404 ? t('profile.notFound') : t('profile.loadFailed');
          container.innerHTML = '<div class="profile-error-card"><p>' + msg + '</p></div>'; return;
        }
        profileData = await profileRes.json();
        if (profileData.error) {
          container.innerHTML = '<div class="profile-error-card"><p>' + t('profile.notFound') + '</p></div>'; return;
        }

        if (!isSelf) {
          var followRes = await apiFetch('/api/interaction/users/' + targetId + '/followers');
          var followData = await followRes.json();
          followState = followData.following || false;
        }

        var roleClass = profileData.role || 'free';
        var avatarHtml = profileData.avatar
          ? '<img src="' + escapeHtml(profileData.avatar) + '" alt=""/>'
          : (profileData.name || 'U').charAt(0).toUpperCase();

        var bioHtml = '';
        if (isSelf) {
          bioHtml = '<div class="profile-bio" id="profileBioDisplay">' +
            (profileData.bio ? escapeHtml(profileData.bio) : '') +
            (profileData.bio ? '' : '<span style="color:var(--text-muted)">' + t('profile.editBio') + '</span>') +
            '</div>' +
            '<div class="profile-bio-edit" id="profileBioEdit" style="display:none">' +
              '<textarea id="profileBioTextarea" maxlength="500" placeholder="' + t('profile.editBio') + '">' + escapeHtml(profileData.bio || '') + '</textarea>' +
              '<div class="profile-bio-actions">' +
                '<button class="profile-bio-save" onclick="saveBio()">' + t('profile.saveBio') + '</button>' +
                '<button class="profile-bio-cancel" onclick="cancelBio()">' + t('profile.cancelBio') + '</button>' +
              '</div>' +
            '</div>';
        } else {
          bioHtml = profileData.bio
            ? '<div class="profile-bio">' + escapeHtml(profileData.bio) + '</div>'
            : '';
        }

        var followBtnHtml = !isSelf
          ? '<button class="watch-follow-btn' + (followState ? ' active' : '') + '" id="profileFollowBtn" onclick="toggleProfileFollow(\'' + targetId + '\')">' + (followState ? t('profile.followed') : t('profile.follow')) + '</button>'
          : '';

        container.innerHTML =
          '<div class="profile-header">' +
            '<div class="profile-avatar">' + avatarHtml + '</div>' +
            '<div class="profile-info">' +
              '<div class="profile-name-row">' +
                '<span class="profile-name">' + escapeHtml(profileData.name || 'Unknown') + '</span>' +
                '<span class="profile-role ' + roleClass + '">' + roleClass + '</span>' +
              '</div>' +
              bioHtml +
              '<div class="profile-stats">' +
                '<div class="profile-stat"><div class="profile-stat-value">' + (profileData.followerCount || 0) + '</div><div class="profile-stat-label">' + t('profile.followers') + '</div></div>' +
                '<div class="profile-stat"><div class="profile-stat-value">' + (profileData.followingCount || 0) + '</div><div class="profile-stat-label">' + t('profile.following') + '</div></div>' +
                '<div class="profile-stat"><div class="profile-stat-value">' + timeAgo(profileData.createdAt) + '</div><div class="profile-stat-label">' + t('profile.joined') + '</div></div>' +
              '</div>' +
              followBtnHtml +
            '</div>' +
          '</div>' +
          '<div class="profile-tabs">' +
            '<div class="profile-tab active" data-tab="content">' + t('profile.contentTab') + '</div>' +
            (isSelf ? '<div class="profile-tab" data-tab="history">' + t('profile.historyTab') + '</div>' : '') +
          '</div>' +
          '<div class="profile-section active" id="section-content"></div>' +
          '<div class="profile-section" id="section-history"></div>';

        if (isSelf) {
          loadMyContent();
          var bioDisplay = document.getElementById('profileBioDisplay');
          if (bioDisplay) bioDisplay.addEventListener('click', function() {
            if (isSelf) {
              document.getElementById('profileBioDisplay').style.display = 'none';
              document.getElementById('profileBioEdit').style.display = 'flex';
              document.getElementById('profileBioTextarea').focus();
            }
          });
        } else {
          loadUserContent(targetId);
        }

        document.querySelectorAll('.profile-tab').forEach(function(tab) {
          tab.addEventListener('click', function() {
            document.querySelectorAll('.profile-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.profile-section').forEach(function(s) { s.classList.remove('active'); });
            tab.classList.add('active');
            var sectionId = 'section-' + tab.dataset.tab;
            document.getElementById(sectionId).classList.add('active');
            if (tab.dataset.tab === 'history' && isSelf) loadHistory();
          });
        });
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="profile-error-card"><p>' + t('profile.loadFailed') + '</p></div>';
      }
    }

    async function loadUserContent(targetId) {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-content');
      try {
        var res = await fetch('/api/content?uploader=' + targetId + '&limit=20', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await res.json();
        var items = data.data || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">' + t('profile.noContent') + '</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">' + t('profile.loadFailed') + '</div>'; }
    }

    async function loadMyContent() {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-content');
      try {
        var res = await fetch('/api/content?limit=20', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await res.json();
        var items = data.data || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">' + t('profile.noContent') + '</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">' + t('profile.loadFailed') + '</div>'; }
    }

    async function loadHistory() {
      var token = localStorage.getItem('zenglance_token');
      var grid = document.getElementById('section-history');
      grid.innerHTML = '<div class="profile-loading">' + t('admin.loading') + '</div>';
      try {
        var res = await apiFetch('/api/interaction/history?limit=30');
        var data = await res.json();
        var items = data.history || [];
        if (!items.length) { grid.innerHTML = '<div class="profile-empty">' + t('profile.noHistory') + '</div>'; return; }
        renderContentGrid(grid, items);
      } catch (e) { grid.innerHTML = '<div class="profile-empty">' + t('profile.loadFailed') + '</div>'; }
    }

    function renderContentGrid(container, items) {
      container.innerHTML = '<div class="profile-grid">';
      items.forEach(function(item) {
        var el = document.createElement('a');
        el.className = 'profile-content-item';
        el.href = '/watch.html?id=' + item.id;
        el.innerHTML =
          '<div class="profile-content-thumb">' +
            (item.thumbnail ? '<img src="' + escapeHtml(item.thumbnail) + '" alt=""/>' : '\u25B6') +
          '</div>' +
          '<div class="profile-content-info">' +
            '<div class="profile-content-title">' + escapeHtml(item.title) + '</div>' +
            '<div class="profile-content-meta">' +
              (item.views ? formatViews(item.views) + ' ' + t('player.views') : '') +
              (item.duration ? '  \u00B7  ' + Math.floor(item.duration / 60) + ':' + String(item.duration % 60).padStart(2, '0') : '') +
            '</div>' +
          '</div>';
        container.appendChild(el);
      });
      container.innerHTML += '</div>';
    }

    async function toggleProfileFollow(targetId) {
      var token = localStorage.getItem('zenglance_token');
      if (!token) { alert(t('profile.loginRequired')); return; }
      followState = !followState;
      var btn = document.getElementById('profileFollowBtn');
      btn.textContent = followState ? t('profile.followed') : t('profile.follow');
      btn.classList.toggle('active', followState);
      apiFetch('/api/interaction/users/' + targetId + '/follow', { method: 'POST' })
        .catch(function() { followState = !followState; btn.textContent = followState ? t('profile.followed') : t('profile.follow'); btn.classList.toggle('active', followState); });
    }

    window.saveBio = async function() {
      var val = document.getElementById('profileBioTextarea').value;
      try {
        var res = await apiFetch('/auth/me', { method: 'PATCH', body: JSON.stringify({ bio: val }) });
        if (!res.ok) throw new Error('Failed');
        var data = await res.json();
        if (data.data && data.data.bio !== undefined) {
          profileData.bio = data.data.bio;
          document.getElementById('profileBioDisplay').innerHTML = escapeHtml(data.data.bio) || '<span style="color:var(--text-muted)">' + t('profile.editBio') + '</span>';
          document.getElementById('profileBioEdit').style.display = 'none';
          document.getElementById('profileBioDisplay').style.display = 'block';
        }
      } catch (e) {
        alert(t('profile.loadFailed'));
      }
    };

    window.cancelBio = function() {
      document.getElementById('profileBioEdit').style.display = 'none';
      document.getElementById('profileBioDisplay').style.display = 'block';
    };

    function init() {
      if (window.i18n) window.i18n.init();
      loadUser().then(function(user) {
        if (!user) {
          document.getElementById('profileContent').innerHTML =
            '<div class="profile-error-card">' +
              '<p>' + t('profile.loginRequired') + '</p>' +
              '<a href="/login.html" class="profile-error-btn">' + t('meta.login') + '</a>' +
            '</div>';
          return;
        }
        loadProfile(user);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
